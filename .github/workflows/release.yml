                      "events":[{"timestampMs":now-2000,"leg":"forward","snr":5.0,"traceId":123,"transport":"rf"}],
                      "latestTraceId":123,"latestPacketId":456,"latestChannel":0,
                  }],
                  "traces":[]
              }
              ta._topology_history_ingest(raw1)
              raw2={"sourceId":"test-source","generatedAtMs":now+5000,"summary":{"nodesInApi":1},
