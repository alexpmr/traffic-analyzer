name: Publicar Traffic Analyzer

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versao
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validar Python
        shell: bash
        run: python -m py_compile traffic_analyzer.py traffic_analyzer_web.py auto_update.py

      - name: Validar scripts shell
        shell: bash
        run: bash -n install.sh update.sh

      - name: Validar replies e reações no backend
        shell: bash
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta
          calls=[]
          ta.MM_API_TOKEN="test-token"
          def fake(path,payload):
              calls.append((path,payload))
              return {"success":True}
          ta._mm_api_post=fake
          ta._send_primary_message("resposta",reply_id=321)
          path,payload=calls.pop(0)
          assert path.endswith("/messages") and payload["replyId"]==321
          ta._send_primary_message("👍",reply_id=321,emoji=True)
          path,payload=calls.pop(0)
          assert path=="/api/messages/send" and payload["emoji"]==1 and payload["replyId"]==321
          PY

      - name: Validar JavaScript embutido
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("traffic_analyzer_web.py").read_text(encoding="utf-8")
          marker = "<script>\n"
          start = src.index(marker) + len(marker)
          end = src.index("</script>\n</body>", start)
          Path("/tmp/traffic-analyzer.js").write_text(src[start:end], encoding="utf-8")
          PY
          node --check /tmp/traffic-analyzer.js

      - name: Smoke test real da interface
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          cat >/tmp/topology.json <<'JSON'
          {"generatedAtMs":0,"summary":{"nodesInApi":1,"traceroutesRead":0,"traceroutesInWindow":0,"routeParticipants":0,"identified":1,"stub":0,"routeOnly":0,"mappableNodes":1,"observedEdges":0,"mappableEdges":0},"nodes":[{"nodeNum":1,"nodeId":"!00000001","name":"TESTE","shortName":"TST","latitude":-15.8,"longitude":-47.9,"state":"identified"}],"edges":[],"traces":[]}
          JSON
          MAP_BIND=127.0.0.1 MAP_PORT=8788 TOPOLOGY_FILE=/tmp/topology.json TRAFFIC_ARCHIVE_DB=/tmp/traffic.db UPDATE_SETTINGS_FILE=/tmp/update-settings.json UPDATE_REQUEST_FILE=/tmp/update-request.json UPDATE_STATUS_FILE=/tmp/update-status.json LAST_INSTALL_FILE=/tmp/last-install.json python traffic_analyzer_web.py >/tmp/ta-web.log 2>&1 &
          echo $! >/tmp/ta-web.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8788/health", timeout=1) as r:
                      if r.status == 200: break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit(open("/tmp/ta-web.log").read())
          PY
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          import json, time
          opt=Options()
          for a in ["--headless=new","--no-sandbox","--disable-dev-shm-usage","--window-size=1600,1000"]: opt.add_argument(a)
          opt.set_capability("goog:loggingPrefs",{"browser":"ALL"})
          d=webdriver.Chrome(options=opt)
          try:
              d.get("http://127.0.0.1:8788/")
              time.sleep(2)
              logs=d.get_log("browser")
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
              labels=[o.text for o in d.find_element(By.ID,"uiLanguage").find_elements(By.TAG_NAME,"option")]
              assert labels==["🇧🇷 Português","🇺🇸 English"],labels
              for view in ["traffic","messages","health","anomalies","settings","help","map"]:
                  d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,f'.navbtn[data-view="{view}"]'))
                  time.sleep(.1)
                  assert d.find_element(By.CSS_SELECTOR,".view.active").get_attribute("id")=={"traffic":"viewTraffic","messages":"viewMessages","health":"viewHealth","anomalies":"viewAnomalies","settings":"viewSettings","help":"viewHelp","map":"viewMap"}[view]
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionBadge"))
              assert d.find_element(By.ID,"versionContinue").text=="Continuar"
              assert not d.find_elements(By.CSS_SELECTOR,"#versionModalBackdrop .updateCmd")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionContinue"))
              sound=d.find_element(By.ID,"soundTheme")
              assert [o.get_attribute("value") for o in sound.find_elements(By.TAG_NAME,"option")]==["pinball70","formal","radio","silent"]
              d.execute_script("arguments[0].value='pinball70';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",sound)
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"soundTest"))
              time.sleep(1.2)

              d.execute_script("""
                primaryMessages=[
                  {id:'default_2_101',fromNodeId:'!00000002',fromName:'NODE2',text:'Original',channel:0,createdAt:Date.now()-3000,mine:false},
                  {id:'default_1_102',fromNodeId:'!00000001',fromName:'TESTE',text:'Resposta',channel:0,createdAt:Date.now()-2000,mine:true,replyId:101},
                  {id:'default_3_103',fromNodeId:'!00000003',fromName:'NODE3',text:'❤️',channel:0,createdAt:Date.now()-1000,mine:false,replyId:101,emoji:1}
                ];messagesInitialized=true;renderMessages(false);
              """)
              assert len(d.find_elements(By.CSS_SELECTOR,".msgRow"))==2
              assert d.find_elements(By.CSS_SELECTOR,".reactionChip")
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'[data-replymsg="default_2_101"]'))
              assert "open" in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"replyComposerClose"))
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageEmojiBtn"))
              assert "open" in d.find_element(By.ID,"emojiPicker").get_attribute("class")

              d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                topology.traces=[
                  {id:'h1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null},
                  {id:'h2',timestampMs:now+20,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null},
                  {id:'h3',timestampMs:now+40,fromName:'A',toName:'B',animatable:true,forwardPath:[p1,p3,p2],returnPath:null}
                ];
                document.getElementById('playMode').value='history';stopAnimation();playHistoryLoop();
              """)
              time.sleep(.35)
              assert d.execute_script("return activeHistoryAnimations.size")>=2
              d.execute_script("stopAnimation();")

              logs=d.get_log("browser")
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
          finally:
              d.quit()
          PY
          kill "$(cat /tmp/ta-web.pid)" || true

      - name: Gerar manual PDF
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python -m pip install --disable-pip-version-check --quiet reportlab
          python docs/build_manual_pdf.py             --version "$VERSION"             --output "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"
          test -s "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"

      - name: Montar ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist /tmp/traffic-analyzer
          mkdir -p dist /tmp/traffic-analyzer

          for f in \
            traffic_analyzer.py \
            traffic_analyzer_web.py \
            install.sh \
            update.sh \
            auto_update.py \
            VERSION \
            README.md \
            CHANGELOG.md \
            traffic-analyzer.env.example \
            traffic-analyzer-map.env.example \
            traffic-analyzer.service \
            traffic-analyzer-map.service \
            traffic-analyzer-auto-update.service \
            traffic-analyzer-auto-update.path \
            traffic-analyzer.timer; do
            cp "$f" /tmp/traffic-analyzer/
          done

          if [ -d docs ]; then
            cp -a docs /tmp/traffic-analyzer/
          fi

          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            cp "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" /tmp/traffic-analyzer/
          fi

          (
            cd /tmp
            zip -q -r "$GITHUB_WORKSPACE/dist/traffic-analyzer-v${VERSION}.zip" traffic-analyzer
          )
          cp "dist/traffic-analyzer-v${VERSION}.zip" "dist/traffic-analyzer-latest.zip"

      - name: Atualizar ZIPs na branch main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp "dist/traffic-analyzer-v${VERSION}.zip" "traffic-analyzer-v${VERSION}.zip"
          cp "dist/traffic-analyzer-latest.zip" "traffic-analyzer-latest.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "traffic-analyzer-v${VERSION}.zip" traffic-analyzer-latest.zip
          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            git add -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza pacotes ZIP da v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Preparar notas da Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## (v)?" v "([ -]|$)" {found=1; print; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md

          cat >> release-notes.md <<EOF

          ## Screenshots

          ### Mapa e topologia
          ![Mapa e topologia](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/01-mapa-topologia.webp)

          ### Mensagens
          ![Mensagens](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/03-mensagens.webp)

          ### Saude da Rede
          ![Saude da Rede](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/04-saude-da-rede.webp)
          EOF

      - name: Criar Release formal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ASSETS=(
            "dist/traffic-analyzer-v${VERSION}.zip"
            "dist/traffic-analyzer-latest.zip"
          )
          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            ASSETS+=("Documentacao_Traffic_Analyzer_v${VERSION}.pdf")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Traffic Analyzer v${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target main \
              --title "Traffic Analyzer v${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
