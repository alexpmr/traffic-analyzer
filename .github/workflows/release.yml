          assert ta._normalize_archive_retention_days(0)==0
          assert ta._normalize_archive_retention_days(1)==1
          assert ta._normalize_archive_retention_days(7)==7
          assert ta._normalize_archive_retention_days(30)==30
          assert ta._normalize_archive_retention_days(14)==0
          from pathlib import Path
          import tempfile,time,json
          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              ta.TRAFFIC_ARCHIVE_DB=td/"traffic.db"
              ta.ARCHIVE_SETTINGS_FILE=td/"archive-settings.json"
              ta.TOPOLOGY_HISTORY_QUEUE_DIR=td/"topology-history-queue"
              ta.MM_SOURCE="test-source"
              ta._archive_init()
              now=int(time.time()*1000)
              raw1={
                  "sourceId":"test-source","generatedAtMs":now,
                  "summary":{"nodesInApi":2},
                  "nodes":[
                      {"nodeNum":10,"nodeId":"!0000000a","name":"A","longName":"A","shortName":"A","state":"identified","latitude":-15.8,"longitude":-47.9,"lastHeard":now},
