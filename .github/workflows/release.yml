                  conn.execute("INSERT INTO packets(archive_key,source_id,timestamp,archived_at) VALUES(?,?,?,?)",("old","test-source",now-3*86400000,now))
                  conn.execute("INSERT INTO packets(archive_key,source_id,timestamp,archived_at) VALUES(?,?,?,?)",("new","test-source",now,now))
              saved=ta._save_archive_settings({"retentionDays":1})
              assert saved["retentionDays"]==1,saved
              with ta._archive_connect() as conn:
                  assert conn.execute("SELECT COUNT(*) FROM packets").fetchone()[0]==1
                  assert conn.execute("SELECT COUNT(*) FROM topology_nodes").fetchone()[0]>=2
                  assert conn.execute("SELECT COUNT(*) FROM topology_edge_events").fetchone()[0]>=1
