name: Publicar Traffic Analyzer

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versao
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validar Python
        shell: bash
        run: python -m py_compile traffic_analyzer.py traffic_analyzer_web.py meshtastic_query.py auto_update.py set_auth_password.py

      - name: Validar classificação RF e MQTT por hop
        run: |
          python - <<'PY'
          import traffic_analyzer as ta
          nodes={
            10:{"nodeNum":10,"longName":"A","shortName":"A","latitude":-15.80,"longitude":-47.90},
            20:{"nodeNum":20,"longName":"B","shortName":"B","latitude":-15.81,"longitude":-47.89},
            30:{"nodeNum":30,"longName":"VHF3","shortName":"VHF3","latitude":-15.82,"longitude":-47.88},
          }
          tr=[{
            "id":1,"packetId":123,"fromNodeNum":10,"toNodeNum":30,
            "fromNodeId":"!0000000a","toNodeId":"!0000001e",
            "route":"[20]","snrTowards":"[-128,20]","routeBack":None,"snrBack":None,
            "channel":0,"timestamp":1700000000000,"createdAt":1700000000000,
            "transportMechanism":1,
          }]
          top=ta.build_topology(nodes,tr,1700000000000)
          edges={frozenset((e["a"],e["b"])):e for e in top["edges"]}
          ab=edges[frozenset((10,20))]
          bv=edges[frozenset((20,30))]
          assert ab["rfObservations"]==0 and ab["mqttObservations"]==1 and ab["nonRfObservations"]==1,ab
          assert ab["transportClass"]=="mqtt",ab
          assert bv["rfObservations"]==1 and bv["nonRfObservations"]==0,bv
          assert bv["transportClass"]=="rf",bv
          assert ab["events"][0]["transport"]=="mqtt",ab
          assert bv["events"][0]["transport"]=="rf",bv

          # Regressão v1.38.0: transporte do traceroute não é prova de RF por hop.
          # Sem SNR válido, o enlace deve permanecer MQTT/não-RF.
          no_signal=[{
            "id":2,"packetId":124,"fromNodeNum":10,"toNodeNum":20,
            "fromNodeId":"!0000000a","toNodeId":"!00000014",
            "route":"[]","snrTowards":"[]","routeBack":None,"snrBack":None,
            "channel":0,"timestamp":1700000001000,"createdAt":1700000001000,
            "transportMechanism":1,"viaMqtt":False,
          }]
          no_signal_top=ta.build_topology(nodes,no_signal,1700000001000)
          no_signal_edge=no_signal_top["edges"][0]
          assert no_signal_edge["rfObservations"]==0,no_signal_edge
          assert no_signal_edge["mqttObservations"]==1,no_signal_edge
          assert no_signal_edge["transportClass"]=="mqtt",no_signal_edge
          assert no_signal_edge["events"][0]["transport"]=="mqtt",no_signal_edge

          # Regressão v1.53.0: a prova de adjacência vem da API
          # /traceroutes, não de TTL/hop_start de pacote bruto.
          direct_api=[{
            "id":3,"packetId":125,"fromNodeNum":10,"toNodeNum":30,
            "fromNodeId":"!0000000a","toNodeId":"!0000001e",
            "route":"[]","snrTowards":"[20]","routeBack":None,"snrBack":None,
            "channel":0,"timestamp":1700000002000,"createdAt":1700000002000,
            # Mesmo com campos TTL contraditórios, o coletor não os usa.
            "hopStart":3,"hopLimit":2,
          }]
          direct_top=ta.build_topology(nodes,direct_api,1700000002000)
          direct_edge=direct_top["edges"][0]
          assert direct_edge["rfObservations"]==1,direct_edge
          assert direct_edge["directObservations"]==1,direct_edge
          assert direct_edge["events"][0]["directEvidence"] is True,direct_edge
          assert direct_edge["events"][0]["directEvidenceKind"]=="route-adjacency-api",direct_edge

          # A→B→C, onde route=[B], cria somente adjacências consecutivas.
          assert ab["directObservations"]==1,ab
          assert bv["directObservations"]==1,bv
          assert ab["events"][0]["directEvidenceKind"]=="route-adjacency-api",ab
          assert bv["events"][0]["directEvidenceKind"]=="route-adjacency-api",bv
          assert frozenset((10,30)) not in edges,edges
          PY

      - name: Validar ranking RF com evidência confiável
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          import traffic_analyzer_web as web

          with tempfile.TemporaryDirectory() as tmp:
              web.TRAFFIC_ARCHIVE_DB=Path(tmp)/"traffic.db"
              web.ARCHIVE_SETTINGS_FILE=Path(tmp)/"archive-settings.json"
              web.MM_SOURCE="default"
              web._archive_init()
              now=1700000000000
              with web._archive_connect() as conn:
                  for num,name,lat,lon in [
                      (10,"A",-15.80,-47.90),
                      (20,"B",-15.81,-47.89),
                      (30,"C",-15.90,-48.30),
                  ]:
                      node={"nodeNum":num,"nodeId":f"!{num:08x}","name":name,"latitude":lat,"longitude":lon}
                      conn.execute(
                          "INSERT INTO topology_nodes(source_id,node_num,first_seen_ms,last_seen_ms,position_seen_ms,node_json) VALUES(?,?,?,?,?,?)",
                          ("default",num,now,now,now,json.dumps(node)),
                      )
                  # Evidências legadas da v1.52.0: devem ser invalidadas.
                  for key,edge,a,b,kind in [
                      ("legacy-zero","10:30",10,30,"zero-hop-packet"),
                      ("legacy-route","20:30",20,30,"route-adjacency"),
                  ]:
                      conn.execute(
                          """INSERT INTO topology_edge_events(
                               event_key,source_id,edge_id,a,b,timestamp_ms,leg,snr,transport,trace_id,packet_id,channel,
                               observation_count,direct_evidence,direct_evidence_kind,archived_at
                             ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
                          (key,"default",edge,a,b,now,"forward",5.0,"rf","legacy","legacy",0,1,1,kind,now),
                      )

              correction=web._topology_direct_evidence_rebuild_v2()
              assert correction["invalidated"]==2,correction
              assert web._archive_rf_longest_links_query({})["count"]==0

              # Snapshot antigo/queue da v1.52.0 não pode reativar zero-hop-packet.
              old_snapshot={
                  "sourceId":"default","generatedAtMs":now+1,
                  "nodes":[],
                  "edges":[{
                      "id":"10:30","a":10,"b":30,"latestPacketId":"oldpkt",
                      "events":[{
                          "timestampMs":now+1,"leg":"forward","snr":5.0,"traceId":"oldtrace",
                          "transport":"rf","directEvidence":True,"directEvidenceKind":"zero-hop-packet"
                      }]
                  }],"traces":[]
              }
              web._topology_history_ingest(old_snapshot)
              assert web._archive_rf_longest_links_query({})["count"]==0

              # Pacote bruto arquivado nunca promove evidência direta.
              raw_links=web._history_trace_links(10,"[]",30,"[20]","forward")
              assert len(raw_links)==1,raw_links
              assert raw_links[0][5] is False and raw_links[0][6] is None,raw_links

              # Somente snapshot do coletor v1.53, derivado de /traceroutes,
              # usa o evidence kind confiável.
              trusted={
                  "sourceId":"default","generatedAtMs":now+2,
                  "nodes":[],
                  "edges":[{
                      "id":"10:20","a":10,"b":20,"latestPacketId":"123",
                      "events":[{
                          "timestampMs":now+2,"leg":"forward","snr":4.0,"traceId":"1",
                          "transport":"rf","directEvidence":True,"directEvidenceKind":"route-adjacency-api"
                      }]
                  }],"traces":[]
              }
              web._topology_history_ingest(trusted)
              ranked=web._archive_rf_longest_links_query({})
              assert ranked["count"]==1,ranked
              row=ranked["data"][0]
              assert row["edgeId"]=="10:20",ranked
              assert row["directEvidence"] is True,row
              assert row["directEvidenceKinds"]==["route-adjacency-api"],row
              assert "1" in row["evidenceTraceIds"],row
              assert "123" in row["evidencePacketIds"],row

              # A migração é idempotente e não zera evidência v1.53 em novo boot.
              again=web._topology_direct_evidence_rebuild_v2()
              assert again["skipped"] is True,again
              assert web._archive_rf_longest_links_query({})["count"]==1
          PY

      - name: Validar scripts shell
        shell: bash
        run: bash -n install.sh update.sh

      - name: Validar política dos tiles de mapa
        shell: bash
        run: |
          grep -Fq "https://tile.openstreetmap.org/{z}/{x}/{y}.png" traffic_analyzer_web.py
          ! grep -Fq "https://{s}.tile.openstreetmap.org" traffic_analyzer_web.py
          grep -Fq 'Referrer-Policy", "strict-origin-when-cross-origin"' traffic_analyzer_web.py
          ! grep -Fq 'Referrer-Policy", "same-origin"' traffic_analyzer_web.py

      - name: Validar replies e reações no backend
        shell: bash
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta
          calls=[]
          ta.MM_API_TOKEN="test-token"
          def fake(path,payload):
              calls.append((path,payload))
              return {"success":True}
          ta._mm_api_post=fake
          ta._send_primary_message("resposta",reply_id=321)
          path,payload=calls.pop(0)
          assert path.endswith("/messages") and payload["replyId"]==321
          native=ta._send_primary_message("👍",reply_id=321,emoji=True)
          path,payload=calls.pop(0)
          assert path=="/api/messages/send" and payload["emoji"]==1 and payload["replyId"]==321
          assert native["reactionMode"]=="tapback"

          calls.clear()
          def fake_403(path,payload):
              calls.append((path,payload))
              if path=="/api/messages/send":
                  raise RuntimeError('MeshMonitor HTTP 403: {"error":"Insufficient permissions"}')
              return {"success":True}
          ta._mm_api_post=fake_403
          compat=ta._send_primary_message("❤️",reply_id=654,emoji=True)
          assert len(calls)==2,calls
          assert calls[0][0]=="/api/messages/send"
          assert calls[1][0].endswith("/messages")
          assert calls[1][1]["replyId"]==654
          assert "emoji" not in calls[1][1]
          assert compat["reactionMode"]=="compat_reply"
          PY

      - name: Validar backend de consultas Virtual Node
        shell: bash
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta

          ta.NODE_QUERY_BACKEND="auto"
          ta._resolved_mm_source_id=lambda: "source-test"
          ta._node_query_channel=lambda node_num, source_id: 0
          ta._virtual_node_send=lambda node_num, action, channel: {
              "success": True,
              "backend": "virtual-node",
              "packetId": 123456789,
              "channel": channel,
          }

          result=ta._request_node_query(0x383bfc3f,"telemetry_device")
          assert result["success"] is True,result
          assert result["diagnostic"]["backend"]=="virtual-node",result
          assert result["diagnostic"]["packetId"]==123456789,result
          assert result["diagnostic"]["correlationPacketId"]==123456789,result
          assert result["diagnostic"]["channel"]==0,result
          assert "Virtual Node iniciado" in result["acceptedMessage"],result

          result=ta._request_node_query(0x383bfc3f,"position")
          assert result["diagnostic"]["backend"]=="virtual-node",result
          assert result["diagnostic"]["packetId"]==123456789,result
          PY

      - name: Validar autenticação administrativa
        shell: bash
        run: |
          python - <<'PY'
          import set_auth_password as sap
          import traffic_analyzer_web as ta
          ta.AUTH_ENABLED=True
          ta.AUTH_USER="admin"
          ta.AUTH_PASSWORD_HASH=sap.password_hash("SenhaTeste123!")
          assert ta._auth_verify_password("SenhaTeste123!")
          assert not ta._auth_verify_password("senha-errada")
          PY

      - name: Validar JavaScript embutido
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("traffic_analyzer_web.py").read_text(encoding="utf-8")
          marker = "<script>\n"
          start = src.index(marker) + len(marker)
          end = src.index("</script>\n</body>", start)
          Path("/tmp/traffic-analyzer.js").write_text(src[start:end], encoding="utf-8")
          PY
          node --check /tmp/traffic-analyzer.js

