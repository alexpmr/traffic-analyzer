              assert d.find_element(By.ID,"uiTheme").get_attribute("disabled") is None
              assert d.find_element(By.ID,"autoUpdateEnabled").get_attribute("disabled") is not None
              assert d.find_element(By.ID,"autoUpdateEnabled").is_selected()
              assert d.find_element(By.ID,"archiveRetentionDays").get_attribute("disabled") is None
              d.execute_script("arguments[0].value='7';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",d.find_element(By.ID,"archiveRetentionDays"))
              time.sleep(.4)
              archive_saved=d.execute_async_script("""
                const done=arguments[0];fetch('/api/archive/settings',{cache:'no-store'}).then(r=>r.json()).then(done).catch(e=>done({success:false,error:String(e)}));
              """)
              assert archive_saved.get("success") and archive_saved.get("settings",{}).get("retentionDays")==7,archive_saved
              d.execute_script("arguments[0].value='0';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",d.find_element(By.ID,"archiveRetentionDays"))
              time.sleep(.4)
              archive_reset=d.execute_async_script("""
                const done=arguments[0];fetch('/api/archive/settings',{cache:'no-store'}).then(r=>r.json()).then(done).catch(e=>done({success:false,error:String(e)}));
              """)
              assert archive_reset.get("settings",{}).get("retentionDays")==0,archive_reset
              assert d.find_element(By.ID,"saveVisitorDefaults").get_attribute("disabled") is None
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"saveVisitorDefaults"))
              time.sleep(.4)
              saved=d.execute_async_script("""
                const done=arguments[0];fetch('/api/ui-defaults',{cache:'no-store'}).then(r=>r.json()).then(done).catch(e=>done({success:false,error:String(e)}));
              """)
              assert saved.get("success") and saved.get("defaults",{}).get("uiTheme")=="light",saved
              assert saved.get("defaults",{}).get("rfLineColor")=="#ffff00",saved
              assert saved.get("defaults",{}).get("mqttLineColor")=="#ff8c42",saved
              assert saved.get("defaults",{}).get("rfLineWidth")==3 and saved.get("defaults",{}).get("mqttLineWidth")==3,saved
              assert saved.get("defaults",{}).get("weatherRadarEnabled") is True,saved
              assert saved.get("defaults",{}).get("mapType")=="satellite",saved
              for view in ["nodes","traffic","messages","statistics","settings","help","map"]:
                  d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,f'.navbtn[data-view="{view}"]'))
                  time.sleep(.1)
                  assert d.find_element(By.CSS_SELECTOR,".view.active").get_attribute("id")=={"nodes":"viewNodes","traffic":"viewTraffic","messages":"viewMessages","statistics":"viewStatistics","settings":"viewSettings","help":"viewHelp","map":"viewMap"}[view]
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.navbtn[data-view="statistics"]'))
              for tab in ["overview","network","rf","ranking","routing","traffic","queries","chat","energy","anomalies","access"]:
                  d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,f'.statsTab[data-stats-tab="{tab}"]'))
                  time.sleep(.06)
                  panel_id="statsPanel"+tab[:1].upper()+tab[1:]
                  assert "active" in d.find_element(By.ID,panel_id).get_attribute("class")

              # Regressão v1.50.0: controles de Acessos permanecem na faixa
              # principal de Estatísticas, sem segunda toolbar.
              access_controls=d.find_element(By.ID,"statsAccessControls")
              assert "open" in access_controls.get_attribute("class"),access_controls.get_attribute("class")
              assert access_controls.find_element(By.ID,"accessDays")
              assert access_controls.find_element(By.ID,"accessReload")
              assert access_controls.find_element(By.ID,"accessDownload")
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.statsTab[data-stats-tab="rf"]'))
              time.sleep(.06)
              assert "open" not in access_controls.get_attribute("class"),access_controls.get_attribute("class")

              # Regressão v1.51.0: Ranking separado, tabelas fluidas e
              # Pontos de atenção com navegação sticky.
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.statsTab[data-stats-tab="ranking"]'))
              time.sleep(.06)
              assert d.find_element(By.CSS_SELECTOR,'.statsTab[data-stats-tab="ranking"]').text=="Ranking"
              ranking_panel=d.find_element(By.ID,"statsPanelRanking")
              assert ranking_panel.find_element(By.ID,"statsRfLongestRows")
              assert not d.find_element(By.ID,"statsPanelRf").find_elements(By.ID,"statsRfLongestRows")
              fit=d.execute_script("""
                const bodies=[
                  document.querySelector('#statsPanelRanking .statsFitBody'),
                  document.querySelector('#statsPanelRf .statsFitBody')
                ];
                return bodies.map(x=>({client:x.clientWidth,scroll:x.scrollWidth}));
              """)
              assert all(x["scroll"]<=x["client"]+2 for x in fit),fit

              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.statsTab[data-stats-tab="routing"]'))
              time.sleep(.06)
              routing_fit=d.execute_script("""
                const fixtures={
                  statsHopDistribution:'<table class="dashTable statsCompactTable"><thead><tr><th>Hops</th><th>Pacotes</th><th>%</th></tr></thead><tbody><tr><td>0</td><td>4137</td><td>82,7%</td></tr></tbody></table>',
                  statsRelayRows:'<table class="dashTable statsCompactTable"><thead><tr><th>Relay</th><th>Ocorrências</th></tr></thead><tbody><tr><td>217</td><td>792</td></tr></tbody></table>'
                };
                return ['statsHopDistribution','statsRelayRows'].map(id=>{
                  const x=document.getElementById(id);
                  if(!x.querySelector('table'))x.innerHTML=fixtures[id];
                  const table=x.querySelector('table');
                  return {id:id,client:x.clientWidth,scroll:x.scrollWidth,tableMin:getComputedStyle(table).minWidth};
                });
              """)
              assert all(x["scroll"]<=x["client"]+2 for x in routing_fit),routing_fit
              assert all(x["tableMin"] in ("0px","0") for x in routing_fit),routing_fit

              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.statsTab[data-stats-tab="anomalies"]'))
              time.sleep(.06)
              assert d.find_element(By.CSS_SELECTOR,'.statsTab[data-stats-tab="anomalies"]').text=="Pontos de atenção"
              assert d.find_element(By.CSS_SELECTOR,'#statsPanelAnomalies h2').text=="Pontos de atenção"
              sticky=d.execute_script("""
                const view=document.getElementById('viewStatistics');
                const content=document.getElementById('statsContent');
                const list=document.getElementById('anomalyList');
                const filler=document.createElement('div');
                filler.id='stickyTestFiller';
                filler.style.height='1800px';
                list.appendChild(filler);
                content.scrollTop=content.scrollHeight;
                const top=document.querySelector('.statsTopbar');
                const result={
                  viewTop:view.getBoundingClientRect().top,
                  barTop:top.getBoundingClientRect().top,
                  barBottom:top.getBoundingClientRect().bottom,
                  viewBottom:view.getBoundingClientRect().bottom,
                  innerOverflow:getComputedStyle(document.getElementById('viewAnomalies')).overflowY
                };
                filler.remove();content.scrollTop=0;
                return result;
              """)
              assert abs(float(sticky["barTop"])-float(sticky["viewTop"]))<3,sticky
              assert float(sticky["barBottom"])<float(sticky["viewBottom"]),sticky
              assert sticky["innerOverflow"] in ("visible","clip"),sticky

              # Regressão v1.50.0: Tudo é uma rodada concorrente.
              parallel=d.execute_async_script("""
                const done=arguments[arguments.length-1];
                const savedSend=sendNodeQuery;
                const run=nodeQueryRun(987654321);
                run.details={node:{hopsAway:0}};
                const calls=[];
                sendNodeQuery=async (nodeNum,action,fromAll)=>{
                  calls.push({action:action,t:performance.now()});
                  const st=nodeQueryRun(nodeNum).states[action];
                  st.state='received';st.message='ok';
                  await new Promise(resolve=>setTimeout(resolve,80));
                };
                runAllNodeQueries(987654321).then(()=>{
                  sendNodeQuery=savedSend;done(calls);
                }).catch(e=>{
                  sendNodeQuery=savedSend;done({error:String(e)});
                });
              """)
              assert isinstance(parallel,list),parallel
              assert len(parallel)==8,parallel
              times=[float(x["t"]) for x in parallel]
              assert max(times)-min(times)<100,parallel

              report_ok=d.execute_script("""
                statisticsPayload={stats:{total:1,rx:1,tx:0},nodes:[],links:[],packets:[],longestRfLinks:[]};
                anomalyPayload={summary:{total:0,critical:0},data:[]};
                healthPayload={chatInteractions:[]};
                const html=statisticsReportHtml();
                return html.includes('Traffic Analyzer') && html.includes('Imprimir / Salvar como PDF');
              """)
              assert report_ok

              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionBadge"))
              assert d.find_element(By.ID,"versionContinue").text=="Continuar"
              assert not d.find_elements(By.CSS_SELECTOR,"#versionModalBackdrop .updateCmd")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionContinue"))
              sound=d.find_element(By.ID,"soundTheme")
              assert [o.get_attribute("value") for o in sound.find_elements(By.TAG_NAME,"option")]==["pinball70","formal","radio","silent"]
              d.execute_script("arguments[0].value='pinball70';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",sound)
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"soundTest"))
              time.sleep(1.2)

              d.execute_script("""
                primaryMessages=[
                  {id:'default_2_101',fromNodeId:'!00000002',fromName:'NODE2',text:'Original',channel:0,createdAt:Date.now()-3000,mine:false},
                  {id:'default_1_102',fromNodeId:'!00000001',fromName:'TESTE',text:'Resposta',channel:0,createdAt:Date.now()-2000,mine:true,replyId:101},
                  {id:'default_3_103',fromNodeId:'!00000003',fromName:'NODE3',text:'❤️',channel:0,createdAt:Date.now()-1000,mine:false,replyId:101,emoji:1}
                ];messagesInitialized=true;renderMessages(false);
              """)
              assert len(d.find_elements(By.CSS_SELECTOR,".msgRow"))==2
              assert d.find_elements(By.CSS_SELECTOR,".reactionChip")
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'[data-replymsg="default_2_101"]'))
              assert "open" in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"replyComposerClose"))
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageEmojiBtn"))
              assert "open" in d.find_element(By.ID,"emojiPicker").get_attribute("class")
              emoji_px=float(d.execute_script("return parseFloat(getComputedStyle(document.querySelector('#emojiPicker button')).fontSize)"))
              reaction_px=float(d.execute_script("return parseFloat(getComputedStyle(document.querySelector('.reactionChip')).fontSize)"))
              assert emoji_px>=26,(emoji_px,reaction_px)
              assert reaction_px>=18,(emoji_px,reaction_px)

              # Rolagem: atualização da conversa não pode puxar o usuário ao final.
              d.execute_script("""
                const rows=[];
                const base=Date.now()-120000;
                for(let i=0;i<80;i++)rows.push({id:'scroll_2_'+(1000+i),fromNodeId:'!00000002',fromName:'NODE2',text:'Mensagem longa '+i+' '+('x'.repeat(120)),channel:0,createdAt:base+i*1000,mine:false});
                primaryMessages=rows;messagesInitialized=true;messageAutoScroll=true;messagePendingBelow=0;
                renderMessages({forceBottom:true});
                const el=document.getElementById('messageList');
                el.style.scrollBehavior='auto';el.scrollTop=Math.max(0,el.scrollHeight-el.clientHeight-700);
                messageAutoScroll=false;
              """)
              time.sleep(.15)
              old_top=d.execute_script("return document.getElementById('messageList').scrollTop")
              d.execute_script("""
                primaryMessages=[...primaryMessages,{id:'scroll_2_2000',fromNodeId:'!00000002',fromName:'NODE2',text:'NOVA NO FIM '+('y'.repeat(120)),channel:0,createdAt:Date.now(),mine:false}];
                messagePendingBelow=1;renderMessages({forceBottom:false});
              """)
              time.sleep(.15)
              new_top=d.execute_script("return document.getElementById('messageList').scrollTop")
              assert abs(new_top-old_top)<8,(old_top,new_top)
              assert "open" in d.find_element(By.ID,"messageNewBelow").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageNewBelow"))
              time.sleep(.3)
              assert d.execute_script("return messageAutoScroll===true && messagePendingBelow===0")
              assert "open" not in d.find_element(By.ID,"messageNewBelow").get_attribute("class")

              d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                topology.traces=[
                  {id:'h1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null},
                  {id:'h2',timestampMs:now+20,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null},
                  {id:'h3',timestampMs:now+40,fromName:'A',toName:'B',animatable:true,forwardPath:[p1,p3,p2],returnPath:null}
                ];
                document.getElementById('playMode').value='history';stopAnimation();playHistoryLoop();
              """)
              time.sleep(.35)
              assert d.execute_script("return activeHistoryAnimations.size")>=2
              d.execute_script("stopAnimation();")

              logs=d.get_log("browser")
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
          finally:
              d.quit()
          PY
          kill "$(cat /tmp/ta-web.pid)" || true

      - name: Gerar manual PDF
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python -m pip install --disable-pip-version-check --quiet reportlab
          python docs/build_manual_pdf.py             --version "$VERSION"             --output "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"
          test -s "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"

      - name: Montar ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist /tmp/traffic-analyzer
          mkdir -p dist /tmp/traffic-analyzer

          for f in \
            traffic_analyzer.py \
            traffic_analyzer_web.py \
            meshtastic_query.py \
            install.sh \
            update.sh \
            auto_update.py \
            set_auth_password.py \
            VERSION \
            README.md \
            CHANGELOG.md \
            BACKLOG.md \
            traffic-analyzer.env.example \
            traffic-analyzer-map.env.example \
            traffic-analyzer.service \
            traffic-analyzer-map.service \
            traffic-analyzer-auto-update.service \
            traffic-analyzer-auto-update.path \
            traffic-analyzer.timer; do
            cp "$f" /tmp/traffic-analyzer/
          done

          if [ -d docs ]; then
            cp -a docs /tmp/traffic-analyzer/
          fi

          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            cp "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" /tmp/traffic-analyzer/
          fi

          (
            cd /tmp
            zip -q -r "$GITHUB_WORKSPACE/dist/traffic-analyzer-v${VERSION}.zip" traffic-analyzer
          )
          cp "dist/traffic-analyzer-v${VERSION}.zip" "dist/traffic-analyzer-latest.zip"

      - name: Atualizar ZIPs na branch main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp "dist/traffic-analyzer-v${VERSION}.zip" "traffic-analyzer-v${VERSION}.zip"
          cp "dist/traffic-analyzer-latest.zip" "traffic-analyzer-latest.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "traffic-analyzer-v${VERSION}.zip" traffic-analyzer-latest.zip
          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            git add -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza pacotes ZIP da v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Preparar notas da Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## (v)?" v "([ -]|$)" {found=1; print; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md

          cat >> release-notes.md <<EOF

          ## Screenshots

          ### Mapa e topologia
          ![Mapa e topologia](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/01-mapa-topologia.webp)

          ### Mensagens
          ![Mensagens](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/03-mensagens.webp)

          ### Saude da Rede
          ![Saude da Rede](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/04-saude-da-rede.webp)
          EOF

      - name: Criar Release formal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ASSETS=(
            "dist/traffic-analyzer-v${VERSION}.zip"
            "dist/traffic-analyzer-latest.zip"
          )
          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            ASSETS+=("Documentacao_Traffic_Analyzer_v${VERSION}.pdf")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Traffic Analyzer v${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target main \
              --title "Traffic Analyzer v${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
