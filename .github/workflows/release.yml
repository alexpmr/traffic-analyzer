name: Publicar Traffic Analyzer

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versao
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validar Python
        shell: bash
        run: python -m py_compile traffic_analyzer.py traffic_analyzer_web.py auto_update.py set_auth_password.py

      - name: Validar classificação RF e MQTT por hop
        run: |
          python - <<'PY'
          import traffic_analyzer as ta
          nodes={
            10:{"nodeNum":10,"longName":"A","shortName":"A","latitude":-15.80,"longitude":-47.90},
            20:{"nodeNum":20,"longName":"B","shortName":"B","latitude":-15.81,"longitude":-47.89},
            30:{"nodeNum":30,"longName":"VHF3","shortName":"VHF3","latitude":-15.82,"longitude":-47.88},
          }
          tr=[{
            "id":1,"packetId":123,"fromNodeNum":10,"toNodeNum":30,
            "fromNodeId":"!0000000a","toNodeId":"!0000001e",
            "route":"[20]","snrTowards":"[-128,20]","routeBack":None,"snrBack":None,
            "channel":0,"timestamp":1700000000000,"createdAt":1700000000000,
            "transportMechanism":1,
          }]
          top=ta.build_topology(nodes,tr,1700000000000)
          edges={frozenset((e["a"],e["b"])):e for e in top["edges"]}
          ab=edges[frozenset((10,20))]
          bv=edges[frozenset((20,30))]
          assert ab["rfObservations"]==0 and ab["mqttObservations"]==1 and ab["nonRfObservations"]==1,ab
          assert ab["transportClass"]=="mqtt",ab
          assert bv["rfObservations"]==1 and bv["nonRfObservations"]==0,bv
          assert bv["transportClass"]=="rf",bv
          assert ab["events"][0]["transport"]=="mqtt",ab
          assert bv["events"][0]["transport"]=="rf",bv
          PY

      - name: Validar scripts shell
        shell: bash
        run: bash -n install.sh update.sh

      - name: Validar política dos tiles de mapa
        shell: bash
        run: |
          grep -Fq "https://tile.openstreetmap.org/{z}/{x}/{y}.png" traffic_analyzer_web.py
          ! grep -Fq "https://{s}.tile.openstreetmap.org" traffic_analyzer_web.py
          grep -Fq 'Referrer-Policy", "strict-origin-when-cross-origin"' traffic_analyzer_web.py
          ! grep -Fq 'Referrer-Policy", "same-origin"' traffic_analyzer_web.py

      - name: Validar replies e reações no backend
        shell: bash
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta
          calls=[]
          ta.MM_API_TOKEN="test-token"
          def fake(path,payload):
              calls.append((path,payload))
              return {"success":True}
          ta._mm_api_post=fake
          ta._send_primary_message("resposta",reply_id=321)
          path,payload=calls.pop(0)
          assert path.endswith("/messages") and payload["replyId"]==321
          native=ta._send_primary_message("👍",reply_id=321,emoji=True)
          path,payload=calls.pop(0)
          assert path=="/api/messages/send" and payload["emoji"]==1 and payload["replyId"]==321
          assert native["reactionMode"]=="tapback"

          calls.clear()
          def fake_403(path,payload):
              calls.append((path,payload))
              if path=="/api/messages/send":
                  raise RuntimeError('MeshMonitor HTTP 403: {"error":"Insufficient permissions"}')
              return {"success":True}
          ta._mm_api_post=fake_403
          compat=ta._send_primary_message("❤️",reply_id=654,emoji=True)
          assert len(calls)==2,calls
          assert calls[0][0]=="/api/messages/send"
          assert calls[1][0].endswith("/messages")
          assert calls[1][1]["replyId"]==654
          assert "emoji" not in calls[1][1]
          assert compat["reactionMode"]=="compat_reply"
          PY

      - name: Validar autenticação administrativa
        shell: bash
        run: |
          python - <<'PY'
          import set_auth_password as sap
          import traffic_analyzer_web as ta
          ta.AUTH_ENABLED=True
          ta.AUTH_USER="admin"
          ta.AUTH_PASSWORD_HASH=sap.password_hash("SenhaTeste123!")
          assert ta._auth_verify_password("SenhaTeste123!")
          assert not ta._auth_verify_password("senha-errada")
          PY

      - name: Validar JavaScript embutido
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("traffic_analyzer_web.py").read_text(encoding="utf-8")
          marker = "<script>\n"
          start = src.index(marker) + len(marker)
          end = src.index("</script>\n</body>", start)
          Path("/tmp/traffic-analyzer.js").write_text(src[start:end], encoding="utf-8")
          PY
          node --check /tmp/traffic-analyzer.js

      - name: Smoke test real da interface
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          cat >/tmp/topology.json <<'JSON'
          {"generatedAtMs":0,"summary":{"nodesInApi":1,"traceroutesRead":0,"traceroutesInWindow":0,"routeParticipants":0,"identified":1,"stub":0,"routeOnly":0,"mappableNodes":1,"observedEdges":0,"mappableEdges":0},"nodes":[{"nodeNum":1,"nodeId":"!00000001","name":"TESTE","shortName":"TST","latitude":-15.8,"longitude":-47.9,"state":"identified"}],"edges":[],"traces":[]}
          JSON
          AUTH_HASH="$(python - <<'PY'
          import set_auth_password as sap
          print(sap.password_hash("SenhaTeste123!"))
          PY
          )"
          TA_AUTH_ENABLED=true TA_AUTH_USER=admin TA_AUTH_PASSWORD_HASH="$AUTH_HASH" TA_AUTH_SESSION_HOURS=12 MAP_BIND=127.0.0.1 MAP_PORT=8788 TOPOLOGY_FILE=/tmp/topology.json TRAFFIC_ARCHIVE_DB=/tmp/traffic.db UPDATE_SETTINGS_FILE=/tmp/update-settings.json UPDATE_REQUEST_FILE=/tmp/update-request.json UPDATE_STATUS_FILE=/tmp/update-status.json LAST_INSTALL_FILE=/tmp/last-install.json UI_DEFAULTS_FILE=/tmp/ui-defaults.json python traffic_analyzer_web.py >/tmp/ta-web.log 2>&1 &
          echo $! >/tmp/ta-web.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8788/health", timeout=1) as r:
                      if r.status == 200: break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit(open("/tmp/ta-web.log").read())
          PY
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          import json, time
          opt=Options()
          for a in ["--headless=new","--no-sandbox","--disable-dev-shm-usage","--window-size=1600,1000"]: opt.add_argument(a)
          opt.set_capability("goog:loggingPrefs",{"browser":"ALL"})
          d=webdriver.Chrome(options=opt)
          try:
              d.get("http://127.0.0.1:8788/")
              time.sleep(2)
              logs=d.get_log("browser")
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
              labels=[o.text for o in d.find_element(By.ID,"uiLanguage").find_elements(By.TAG_NAME,"option")]
              assert labels==["🇧🇷 Português","🇺🇸 English"],labels

              osm_url=d.execute_script("return baseMaps.osm.url")
              assert osm_url=="https://tile.openstreetmap.org/{z}/{x}/{y}.png",osm_url
              fallback=d.execute_script("""
                document.getElementById('mapType').value='osm';
                setBaseMap('osm');
                for(let i=0;i<4;i++)baseLayer.fire('tileerror');
                return document.getElementById('mapType').value;
              """)
              assert fallback=="light",fallback
              assert not d.find_elements(By.CSS_SELECTOR,'.navbtn[data-view="tracklog"]')
              assert not d.find_elements(By.ID,"viewTracklog")
              time.sleep(.3)
              assert d.execute_script("return authState.enabled===true && authState.authenticated===false")
              assert d.find_element(By.ID,"messageInput").get_attribute("disabled") is not None
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.navbtn[data-view="settings"]'))
              # Visitante pode personalizar somente a própria interface.
              assert d.find_element(By.ID,"uiTheme").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mapType").get_attribute("disabled") is None
              assert d.find_element(By.ID,"rfLineColor").get_attribute("disabled") is None
              assert d.find_element(By.ID,"rfLineWidth").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mqttLineColor").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mqttLineWidth").get_attribute("disabled") is None
              assert d.find_element(By.ID,"autoUpdateEnabled").get_attribute("disabled") is not None
              assert d.find_element(By.ID,"saveVisitorDefaults").get_attribute("disabled") is not None
              d.execute_script("arguments[0].value='light';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",d.find_element(By.ID,"uiTheme"))
              assert d.execute_script("return document.body.dataset.theme==='light'")
              assert d.execute_script("return JSON.parse(localStorage.getItem(PREF_KEY)).uiTheme==='light'")
              styles=d.execute_script("""
                topology={
                  generatedAtMs:Date.now(),
                  nodes:[
                    {nodeNum:10,nodeId:'!0000000a',name:'A',shortName:'A',latitude:-15.80,longitude:-47.90,state:'identified'},
                    {nodeNum:20,nodeId:'!00000014',name:'B',shortName:'B',latitude:-15.81,longitude:-47.89,state:'identified'},
                    {nodeNum:30,nodeId:'!0000001e',name:'VHF3',shortName:'VHF3',latitude:-15.82,longitude:-47.88,state:'identified'}
                  ],
                  edges:[
                    {a:10,b:20,aId:'!0000000a',bId:'!00000014',aName:'A',bName:'B',geometry:[[-15.80,-47.90],[-15.81,-47.89]],events:[{timestampMs:Date.now(),leg:'forward',snr:null,traceId:1,transport:'mqtt'}]},
                    {a:20,b:30,aId:'!00000014',bId:'!0000001e',aName:'B',bName:'VHF3',geometry:[[-15.81,-47.89],[-15.82,-47.88]],events:[{timestampMs:Date.now(),leg:'forward',snr:5,traceId:1,transport:'rf'}]}
                  ],
                  traces:[]
                };
                document.getElementById('ageHours').value='all';
                document.getElementById('showLines').checked=true;
                render();
                return lineLayer.getLayers().map(x=>({dash:x.options.dashArray||'',color:x.options.color,weight:x.options.weight}));
              """)
              assert len(styles)==2,styles
              assert styles[0]["dash"]=="10 8",styles
              assert styles[1]["dash"] in ("",None),styles
              assert "Tipo de enlace" in d.find_element(By.CSS_SELECTOR,".legend").text
              assert "MQTT / não-RF" in d.find_element(By.CSS_SELECTOR,".legend").text
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"authAction"))
              d.find_element(By.ID,"authUsername").clear()
              d.find_element(By.ID,"authUsername").send_keys("admin")
              d.find_element(By.ID,"authPassword").send_keys("SenhaTeste123!")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"authLoginSubmit"))
              for _ in range(30):
                  if d.execute_script("return authState.authenticated===true"): break
                  time.sleep(.1)
              assert d.execute_script("return authState.authenticated===true")
              assert d.find_element(By.ID,"uiTheme").get_attribute("disabled") is None
              assert d.find_element(By.ID,"autoUpdateEnabled").get_attribute("disabled") is None
              assert d.find_element(By.ID,"saveVisitorDefaults").get_attribute("disabled") is None
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"saveVisitorDefaults"))
              time.sleep(.4)
              saved=d.execute_async_script("""
                const done=arguments[0];fetch('/api/ui-defaults',{cache:'no-store'}).then(r=>r.json()).then(done).catch(e=>done({success:false,error:String(e)}));
              """)
              assert saved.get("success") and saved.get("defaults",{}).get("uiTheme")=="light",saved
              assert saved.get("defaults",{}).get("rfLineColor")=="#ffff00",saved
              assert saved.get("defaults",{}).get("mqttLineColor")=="#ff8c42",saved
              assert saved.get("defaults",{}).get("rfLineWidth")==3 and saved.get("defaults",{}).get("mqttLineWidth")==3,saved
              for view in ["traffic","messages","health","anomalies","settings","help","map"]:
                  d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,f'.navbtn[data-view="{view}"]'))
                  time.sleep(.1)
                  assert d.find_element(By.CSS_SELECTOR,".view.active").get_attribute("id")=={"traffic":"viewTraffic","messages":"viewMessages","health":"viewHealth","anomalies":"viewAnomalies","settings":"viewSettings","help":"viewHelp","map":"viewMap"}[view]
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionBadge"))
              assert d.find_element(By.ID,"versionContinue").text=="Continuar"
              assert not d.find_elements(By.CSS_SELECTOR,"#versionModalBackdrop .updateCmd")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionContinue"))
              sound=d.find_element(By.ID,"soundTheme")
              assert [o.get_attribute("value") for o in sound.find_elements(By.TAG_NAME,"option")]==["pinball70","formal","radio","silent"]
              d.execute_script("arguments[0].value='pinball70';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",sound)
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"soundTest"))
              time.sleep(1.2)

              d.execute_script("""
                primaryMessages=[
                  {id:'default_2_101',fromNodeId:'!00000002',fromName:'NODE2',text:'Original',channel:0,createdAt:Date.now()-3000,mine:false},
                  {id:'default_1_102',fromNodeId:'!00000001',fromName:'TESTE',text:'Resposta',channel:0,createdAt:Date.now()-2000,mine:true,replyId:101},
                  {id:'default_3_103',fromNodeId:'!00000003',fromName:'NODE3',text:'❤️',channel:0,createdAt:Date.now()-1000,mine:false,replyId:101,emoji:1}
                ];messagesInitialized=true;renderMessages(false);
              """)
              assert len(d.find_elements(By.CSS_SELECTOR,".msgRow"))==2
              assert d.find_elements(By.CSS_SELECTOR,".reactionChip")
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'[data-replymsg="default_2_101"]'))
              assert "open" in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"replyComposerClose"))
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageEmojiBtn"))
              assert "open" in d.find_element(By.ID,"emojiPicker").get_attribute("class")
              emoji_px=float(d.execute_script("return parseFloat(getComputedStyle(document.querySelector('#emojiPicker button')).fontSize)"))
              reaction_px=float(d.execute_script("return parseFloat(getComputedStyle(document.querySelector('.reactionChip')).fontSize)"))
              assert emoji_px>=26,(emoji_px,reaction_px)
              assert reaction_px>=18,(emoji_px,reaction_px)

              # Rolagem: atualização da conversa não pode puxar o usuário ao final.
              d.execute_script("""
                const rows=[];
                const base=Date.now()-120000;
                for(let i=0;i<80;i++)rows.push({id:'scroll_2_'+(1000+i),fromNodeId:'!00000002',fromName:'NODE2',text:'Mensagem longa '+i+' '+('x'.repeat(120)),channel:0,createdAt:base+i*1000,mine:false});
                primaryMessages=rows;messagesInitialized=true;messageAutoScroll=true;messagePendingBelow=0;
                renderMessages({forceBottom:true});
                const el=document.getElementById('messageList');
                el.style.scrollBehavior='auto';el.scrollTop=Math.max(0,el.scrollHeight-el.clientHeight-700);
                messageAutoScroll=false;
              """)
              time.sleep(.15)
              old_top=d.execute_script("return document.getElementById('messageList').scrollTop")
              d.execute_script("""
                primaryMessages=[...primaryMessages,{id:'scroll_2_2000',fromNodeId:'!00000002',fromName:'NODE2',text:'NOVA NO FIM '+('y'.repeat(120)),channel:0,createdAt:Date.now(),mine:false}];
                messagePendingBelow=1;renderMessages({forceBottom:false});
              """)
              time.sleep(.15)
              new_top=d.execute_script("return document.getElementById('messageList').scrollTop")
              assert abs(new_top-old_top)<8,(old_top,new_top)
              assert "open" in d.find_element(By.ID,"messageNewBelow").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageNewBelow"))
              time.sleep(.3)
              assert d.execute_script("return messageAutoScroll===true && messagePendingBelow===0")
              assert "open" not in d.find_element(By.ID,"messageNewBelow").get_attribute("class")

              d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                topology.traces=[
                  {id:'h1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null},
                  {id:'h2',timestampMs:now+20,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null},
                  {id:'h3',timestampMs:now+40,fromName:'A',toName:'B',animatable:true,forwardPath:[p1,p3,p2],returnPath:null}
                ];
                document.getElementById('playMode').value='history';stopAnimation();playHistoryLoop();
              """)
              time.sleep(.35)
              assert d.execute_script("return activeHistoryAnimations.size")>=2
              d.execute_script("stopAnimation();")

              logs=d.get_log("browser")
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
          finally:
              d.quit()
          PY
          kill "$(cat /tmp/ta-web.pid)" || true

      - name: Gerar manual PDF
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python -m pip install --disable-pip-version-check --quiet reportlab
          python docs/build_manual_pdf.py             --version "$VERSION"             --output "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"
          test -s "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"

      - name: Montar ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist /tmp/traffic-analyzer
          mkdir -p dist /tmp/traffic-analyzer

          for f in \
            traffic_analyzer.py \
            traffic_analyzer_web.py \
            install.sh \
            update.sh \
            auto_update.py \
            set_auth_password.py \
            VERSION \
            README.md \
            CHANGELOG.md \
            traffic-analyzer.env.example \
            traffic-analyzer-map.env.example \
            traffic-analyzer.service \
            traffic-analyzer-map.service \
            traffic-analyzer-auto-update.service \
            traffic-analyzer-auto-update.path \
            traffic-analyzer.timer; do
            cp "$f" /tmp/traffic-analyzer/
          done

          if [ -d docs ]; then
            cp -a docs /tmp/traffic-analyzer/
          fi

          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            cp "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" /tmp/traffic-analyzer/
          fi

          (
            cd /tmp
            zip -q -r "$GITHUB_WORKSPACE/dist/traffic-analyzer-v${VERSION}.zip" traffic-analyzer
          )
          cp "dist/traffic-analyzer-v${VERSION}.zip" "dist/traffic-analyzer-latest.zip"

      - name: Atualizar ZIPs na branch main
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp "dist/traffic-analyzer-v${VERSION}.zip" "traffic-analyzer-v${VERSION}.zip"
          cp "dist/traffic-analyzer-latest.zip" "traffic-analyzer-latest.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "traffic-analyzer-v${VERSION}.zip" traffic-analyzer-latest.zip
          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            git add -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza pacotes ZIP da v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Preparar notas da Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## (v)?" v "([ -]|$)" {found=1; print; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md

          cat >> release-notes.md <<EOF

          ## Screenshots

          ### Mapa e topologia
          ![Mapa e topologia](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/01-mapa-topologia.webp)

          ### Mensagens
          ![Mensagens](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/03-mensagens.webp)

          ### Saude da Rede
          ![Saude da Rede](https://raw.githubusercontent.com/alexpmr/traffic-analyzer/main/docs/screenshots/04-saude-da-rede.webp)
          EOF

      - name: Criar Release formal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          ASSETS=(
            "dist/traffic-analyzer-v${VERSION}.zip"
            "dist/traffic-analyzer-latest.zip"
          )
          if [ -f "Documentacao_Traffic_Analyzer_v${VERSION}.pdf" ]; then
            ASSETS+=("Documentacao_Traffic_Analyzer_v${VERSION}.pdf")
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "Traffic Analyzer v${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target main \
              --title "Traffic Analyzer v${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
