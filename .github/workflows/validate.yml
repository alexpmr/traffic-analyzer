name: Validar Traffic Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Python
        run: python -m py_compile traffic_analyzer.py traffic_analyzer_web.py meshtastic_query.py auto_update.py set_auth_password.py docs/build_manual_pdf.py

      - name: Validar classificação RF e MQTT por hop
        run: |
          python - <<'PY'
          import traffic_analyzer as ta
          nodes={
            10:{"nodeNum":10,"longName":"A","shortName":"A","latitude":-15.80,"longitude":-47.90},
            20:{"nodeNum":20,"longName":"B","shortName":"B","latitude":-15.81,"longitude":-47.89},
            30:{"nodeNum":30,"longName":"VHF3","shortName":"VHF3","latitude":-15.82,"longitude":-47.88},
          }
          tr=[{
            "id":1,"packetId":123,"fromNodeNum":10,"toNodeNum":30,
            "fromNodeId":"!0000000a","toNodeId":"!0000001e",
            "route":"[20]","snrTowards":"[-128,20]","routeBack":None,"snrBack":None,
            "channel":0,"timestamp":1700000000000,"createdAt":1700000000000,
            "transportMechanism":1,
          }]
          top=ta.build_topology(nodes,tr,1700000000000)
          edges={frozenset((e["a"],e["b"])):e for e in top["edges"]}
          ab=edges[frozenset((10,20))]
          bv=edges[frozenset((20,30))]
          assert ab["rfObservations"]==0 and ab["mqttObservations"]==1 and ab["nonRfObservations"]==1,ab
          assert ab["transportClass"]=="mqtt",ab
          assert bv["rfObservations"]==1 and bv["nonRfObservations"]==0,bv
          assert bv["transportClass"]=="rf",bv
          assert ab["events"][0]["transport"]=="mqtt",ab
          assert bv["events"][0]["transport"]=="rf",bv

          # Regressão v1.38.0: transporte do traceroute não é prova de RF por hop.
          # Sem SNR válido, o enlace deve permanecer MQTT/não-RF.
          no_signal=[{
            "id":2,"packetId":124,"fromNodeNum":10,"toNodeNum":20,
            "fromNodeId":"!0000000a","toNodeId":"!00000014",
            "route":"[]","snrTowards":"[]","routeBack":None,"snrBack":None,
            "channel":0,"timestamp":1700000001000,"createdAt":1700000001000,
            "transportMechanism":1,"viaMqtt":False,
          }]
          no_signal_top=ta.build_topology(nodes,no_signal,1700000001000)
          no_signal_edge=no_signal_top["edges"][0]
          assert no_signal_edge["rfObservations"]==0,no_signal_edge
          assert no_signal_edge["mqttObservations"]==1,no_signal_edge
          assert no_signal_edge["transportClass"]=="mqtt",no_signal_edge
          assert no_signal_edge["events"][0]["transport"]=="mqtt",no_signal_edge
          PY

      - name: Validar shell
        run: bash -n install.sh update.sh

      - name: Validar política dos tiles de mapa
        run: |
          grep -Fq "https://tile.openstreetmap.org/{z}/{x}/{y}.png" traffic_analyzer_web.py
          ! grep -Fq "https://{s}.tile.openstreetmap.org" traffic_analyzer_web.py
          grep -Fq 'Referrer-Policy", "strict-origin-when-cross-origin"' traffic_analyzer_web.py
          ! grep -Fq 'Referrer-Policy", "same-origin"' traffic_analyzer_web.py

      - name: Validar replies e reações no backend
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta
          calls=[]
          ta.MM_API_TOKEN="test-token"
          def fake(path, payload):
              calls.append((path,payload))
              return {"success":True}
          ta._mm_api_post=fake

          ta._send_primary_message("resposta", reply_id=123, emoji=False)
          path,payload=calls.pop(0)
          assert path.endswith("/messages"), path
          assert payload["text"]=="resposta"
          assert payload["channel"]==0
          assert payload["replyId"]==123

          native=ta._send_primary_message("❤️", reply_id=123, emoji=True)
          path,payload=calls.pop(0)
          assert path=="/api/messages/send", path
          assert payload["text"]=="❤️"
          assert payload["replyId"]==123
          assert payload["emoji"]==1
          assert payload["sourceId"]==ta.MM_SOURCE
          assert native["reactionMode"]=="tapback"

          calls.clear()
          def fake_403(path,payload):
              calls.append((path,payload))
              if path=="/api/messages/send":
                  raise RuntimeError('MeshMonitor HTTP 403: {"error":"Insufficient permissions"}')
              return {"success":True}
          ta._mm_api_post=fake_403
          compat=ta._send_primary_message("👍", reply_id=456, emoji=True)
          assert len(calls)==2,calls
          assert calls[0][0]=="/api/messages/send"
          assert calls[1][0].endswith("/messages")
          assert calls[1][1]["replyId"]==456
          assert "emoji" not in calls[1][1]
          assert compat["reactionMode"]=="compat_reply"
          PY

      - name: Validar backend de consultas Virtual Node
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta

          ta.NODE_QUERY_BACKEND="auto"
          ta._resolved_mm_source_id=lambda: "source-test"
          ta._node_query_channel=lambda node_num, source_id: 0
          ta._virtual_node_send=lambda node_num, action, channel: {
              "success": True,
              "backend": "virtual-node",
              "packetId": 123456789,
              "channel": channel,
          }

          result=ta._request_node_query(0x383bfc3f,"telemetry_device")
          assert result["success"] is True,result
          assert result["diagnostic"]["backend"]=="virtual-node",result
          assert result["diagnostic"]["packetId"]==123456789,result
          assert result["diagnostic"]["correlationPacketId"]==123456789,result
          assert result["diagnostic"]["channel"]==0,result
          assert "Virtual Node iniciado" in result["acceptedMessage"],result

          result=ta._request_node_query(0x383bfc3f,"position")
          assert result["diagnostic"]["backend"]=="virtual-node",result
          assert result["diagnostic"]["packetId"]==123456789,result
          PY

      - name: Validar autenticação administrativa
        run: |
          python - <<'PY'
          import set_auth_password as sap
          import traffic_analyzer_web as ta

          ta.AUTH_ENABLED=True
          ta.AUTH_USER="admin"
          ta.AUTH_PASSWORD_HASH=sap.password_hash("SenhaTeste123!")
          assert ta._auth_verify_password("SenhaTeste123!")
          assert not ta._auth_verify_password("senha-errada")
          assert ta.AUTH_PASSWORD_HASH.startswith("pbkdf2_sha256$")
          PY

      - name: Validar JavaScript embutido
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("traffic_analyzer_web.py").read_text(encoding="utf-8")
          marker = "<script>\n"
          start = src.index(marker) + len(marker)
          end = src.index("</script>\n</body>", start)
          Path("/tmp/traffic-analyzer.js").write_text(src[start:end], encoding="utf-8")
          PY
          node --check /tmp/traffic-analyzer.js

      - name: Validar geração do manual
        run: |
          python -m pip install --disable-pip-version-check --quiet reportlab pymupdf
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          src=Path("traffic_analyzer_web.py").read_text(encoding="utf-8")
          m=re.search(r'^APP_VERSION = "([^"]+)"',src,re.M)
          if not m: raise SystemExit("APP_VERSION não encontrado")
          print(m.group(1))
          PY
          )"
          python docs/build_manual_pdf.py --version "$VERSION" --output /tmp/manual.pdf
          test -s /tmp/manual.pdf
          python - <<'PY'
          import fitz
          doc = fitz.open("/tmp/manual.pdf")
          assert len(doc) >= 1
          pix = doc[0].get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
          pix.save("/tmp/manual-preview.png")
          PY
          test -s /tmp/manual-preview.png

      - name: Publicar prévia do manual
        uses: actions/upload-artifact@v4
        with:
          name: manual-preview
          path: |
            /tmp/manual.pdf
            /tmp/manual-preview.png

      - name: Validar camadas v1.43.0
        shell: bash
        run: |
          grep -Fq 'id="rfCoverageEnabled"' traffic_analyzer_web.py
          grep -Fq 'id="hillshadeEnabled"' traffic_analyzer_web.py
          grep -Fq 'id="elevationEnabled"' traffic_analyzer_web.py
          grep -Fq 'Relevo com corte' traffic_analyzer_web.py
          grep -Fq 'Corte do relevo' traffic_analyzer_web.py
          grep -Fq 'id="elevationThresholdSlider"' traffic_analyzer_web.py
          grep -Fq 'id="elevationThresholdNumber"' traffic_analyzer_web.py
          grep -Fq 'type="range" min="0" max="3000" step="50"' traffic_analyzer_web.py
          grep -Fq 'type="number" min="100" max="9000" step="100"' traffic_analyzer_web.py
          grep -Fq '3.000 m' traffic_analyzer_web.py
          grep -Fq 'id="elevationSliderMax"' traffic_analyzer_web.py
          grep -Fq 'height:390px' traffic_analyzer_web.py
          grep -Fq '@media(max-height:700px){.elevationVerticalRange{height:255px}}' traffic_analyzer_web.py
          grep -Fq 'id="elevationOpacity"' traffic_analyzer_web.py
          grep -Fq 'id="lightningEnabled"' traffic_analyzer_web.py
          grep -Fq 'id="alertsEnabled"' traffic_analyzer_web.py
          grep -Fq 'id="cloudsEnabled"' traffic_analyzer_web.py
          grep -Fq '/api/layers/rf-coverage' traffic_analyzer_web.py
          grep -Fq '/api/layers/elevation/tile/' traffic_analyzer_web.py
          grep -Fq '/api/layers/weather-alerts' traffic_analyzer_web.py
          grep -Fq '/api/layers/lightning' traffic_analyzer_web.py
          grep -Fq '/api/layers/clouds/meta' traffic_analyzer_web.py
          grep -Fq 'World_Hillshade/MapServer/tile' traffic_analyzer_web.py
          grep -Fq 'elevation-tiles-prod/terrarium' traffic_analyzer_web.py
          grep -Fq 'TA_ELEVATION_TILE_BASE_URL' traffic-analyzer-map.env.example
          grep -Fq 'TA_RAINBOW_API_TOKEN' traffic-analyzer-map.env.example
          grep -Fq 'TA_LIGHTNING_API_KEY' traffic-analyzer-map.env.example
          python - <<'PY'
          import traffic_analyzer_web as ta
          prefs=ta._sanitize_ui_defaults({
              "weatherRadarEnabled": True,
              "rfCoverageEnabled": True,
              "hillshadeEnabled": True,
              "elevationEnabled": True,
              "elevationThreshold": 1000,
              "elevationSliderMax": 3000,
              "elevationOpacity": 55,
              "lightningEnabled": True,
              "alertsEnabled": True,
              "cloudsEnabled": True,
          })
          for key in ("weatherRadarEnabled","rfCoverageEnabled","hillshadeEnabled","elevationEnabled","lightningEnabled","alertsEnabled","cloudsEnabled"):
              assert prefs.get(key) is True,(key,prefs)
          assert prefs.get("elevationThreshold")==1000,prefs
          assert "elevationThreshold" not in ta._sanitize_ui_defaults({"elevationThreshold": -1})
          assert "elevationThreshold" not in ta._sanitize_ui_defaults({"elevationThreshold": 9001})
          assert ta._sanitize_ui_defaults({"elevationThreshold": 0}).get("elevationThreshold")==0
          assert ta._sanitize_ui_defaults({"elevationThreshold": 9000}).get("elevationThreshold")==9000
          assert prefs.get("elevationSliderMax")==3000,prefs
          assert "elevationSliderMax" not in ta._sanitize_ui_defaults({"elevationSliderMax": 99})
          assert "elevationSliderMax" not in ta._sanitize_ui_defaults({"elevationSliderMax": 9001})
          assert ta._sanitize_ui_defaults({"elevationSliderMax": 100}).get("elevationSliderMax")==100
          assert ta._sanitize_ui_defaults({"elevationSliderMax": 9000}).get("elevationSliderMax")==9000
          assert prefs.get("elevationOpacity")==55,prefs
          assert prefs.get("defaultsVersion")==420,prefs
          PY

      - name: Validar arquivos da infraestrutura de update
        run: |
          test -s traffic-analyzer-auto-update.service
          test -s traffic-analyzer-auto-update.path
          grep -q 'PathExists=/var/lib/traffic-analyzer/update-request.json' traffic-analyzer-auto-update.path
          grep -q 'ExecStart=/usr/bin/python3 /opt/traffic-analyzer/auto_update.py' traffic-analyzer-auto-update.service

      - name: Smoke test da interface no navegador
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          cat >/tmp/topology.json <<'JSON'
          {"generatedAtMs":0,"summary":{"nodesInApi":1,"traceroutesRead":0,"traceroutesInWindow":0,"routeParticipants":0,"identified":1,"stub":0,"routeOnly":0,"mappableNodes":1,"observedEdges":0,"mappableEdges":0},"nodes":[{"nodeNum":1,"nodeId":"!00000001","name":"TESTE","shortName":"TST","latitude":-15.8,"longitude":-47.9,"state":"identified"}],"edges":[],"traces":[]}
          JSON
          AUTH_HASH="$(python - <<'PY'
          import set_auth_password as sap
          print(sap.password_hash("SenhaTeste123!"))
          PY
          )"
          TA_AUTH_ENABLED=true TA_AUTH_USER=admin TA_AUTH_PASSWORD_HASH="$AUTH_HASH" TA_AUTH_SESSION_HOURS=12 MAP_BIND=127.0.0.1 MAP_PORT=8788 TOPOLOGY_FILE=/tmp/topology.json TRAFFIC_ARCHIVE_DB=/tmp/traffic.db UPDATE_SETTINGS_FILE=/tmp/update-settings.json UPDATE_REQUEST_FILE=/tmp/update-request.json UPDATE_STATUS_FILE=/tmp/update-status.json LAST_INSTALL_FILE=/tmp/last-install.json UI_DEFAULTS_FILE=/tmp/ui-defaults.json python traffic_analyzer_web.py >/tmp/ta-web.log 2>&1 &
          echo $! >/tmp/ta-web.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8788/health", timeout=1) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit(open("/tmp/ta-web.log").read())
          PY
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import json, time
          opt=Options()
          opt.add_argument("--headless=new")
          opt.add_argument("--no-sandbox")
          opt.add_argument("--disable-dev-shm-usage")
          opt.add_argument("--window-size=1600,1000")
          opt.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d=webdriver.Chrome(options=opt)
          try:
              d.get("http://127.0.0.1:8788/")
              WebDriverWait(d,20).until(EC.presence_of_element_located((By.ID,"nav")))
              time.sleep(2)
              logs=d.get_log("browser")
              print("BROWSER LOGS AFTER LOAD")
              print(json.dumps(logs,ensure_ascii=False,indent=2))
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe

              button=d.find_element(By.ID,"uiLanguageButton")
              assert "🇧🇷" in button.text and "Português" in button.text,button.text
              button.click()
              opts=d.find_elements(By.CSS_SELECTOR,".languageOption[data-language]")
              labels=[" ".join((o.get_attribute("textContent") or "").replace("✓","").split()) for o in opts]
              assert labels==["🇧🇷Português","🇺🇸English"],labels
              assert d.find_element(By.ID,"uiLanguageMenu").get_attribute("class").find("open")>=0
              opts[1].click()
              assert d.execute_script("return currentLang")=="en"
              assert "🇺🇸" in d.find_element(By.ID,"uiLanguageButton").text
              assert d.find_element(By.CSS_SELECTOR,'.navbtn[data-view="map"]').text=="Map"
              d.execute_script("applyLanguage('pt-BR',true)")
              assert d.execute_script("return currentLang")=="pt-BR"

              assert d.execute_script("return nodeQueryTimeoutMs('telemetry_device')")==90000
              assert d.execute_script("return nodeQueryTimeoutMs('position')")==20000
              assert d.execute_script("return nodeQueryTimeoutMs('telemetry_device',{diagnostic:{backend:'virtual-node'}})")==30000
              correlated=d.execute_script("""
                const now=Date.now();
                const state={sentAt:now-5000,diagnostic:{backend:'virtual-node',packetId:123,correlationPacketId:123}};
                const details={responses:[
                  {port:'TELEMETRY_APP',requestId:999,timestampMs:now-3000},
                  {port:'TELEMETRY_APP',requestId:123,timestampMs:now-1000,channel:0,snr:6.5,rssi:-40}
                ]};
                return {signal:nodeResponseSignal('telemetry_device',details,state),detail:nodeResponseDetail('telemetry_device',details,now-1000,state)};
              """)
              assert correlated["signal"]>0,correlated
              assert "TELEMETRY_APP" in correlated["detail"],correlated
              noresp=d.execute_script("return nodeRoutingResultMessage(8)")
              assert "NO_RESPONSE" in noresp,noresp
              retry_status=d.execute_script("""
                const now=Date.now();
                const state={sentAt:now-35000,acceptedMessage:'MM aceitou'};
                const details={requests:[
                  {port:'TELEMETRY_APP',timestampMs:now-34000,telemetryType:'device',packetId:101},
                  {port:'TELEMETRY_APP',timestampMs:now-2000,telemetryType:'device',packetId:102}
                ]};
                return nodeQueryWaitingMessage('telemetry_device',state,details,now);
              """)
              assert "retry 1" in retry_status.lower(),retry_status
              assert d.execute_script("return nodeQueryNeedsPolling('telemetry_device',{state:'timeout',sentAt:Date.now()-120000})") is True
              assert d.execute_script("return nodeQueryNeedsPolling('telemetry_device',{state:'timeout',sentAt:Date.now()-200000})") is False

              osm_url=d.execute_script("return baseMaps.osm.url")
              assert osm_url=="https://tile.openstreetmap.org/{z}/{x}/{y}.png",osm_url
              fallback=d.execute_script("""
                document.getElementById('mapType').value='osm';
                setBaseMap('osm');
                for(let i=0;i<4;i++)baseLayer.fire('tileerror');
                return document.getElementById('mapType').value;
              """)
              assert fallback=="light",fallback
              d.execute_script("openNodeWindow(1)")
              WebDriverWait(d,10).until(lambda x: "open" in x.find_element(By.ID,"nodeWindow").get_attribute("class"))
              before=d.execute_script("const p=document.getElementById('nodeWindow').getBoundingClientRect();return {left:p.left,top:p.top,width:p.width,height:p.height};")
              moved=d.execute_script("""
                const h=document.getElementById('nodeWindowHeader');
                const r=h.getBoundingClientRect();
                const sx=r.left+40,sy=r.top+15;
                h.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:sx,clientY:sy,pointerId:77,pointerType:'mouse',button:0}));
                h.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:sx+110,clientY:sy+55,pointerId:77,pointerType:'mouse',button:0}));
                h.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,clientX:sx+110,clientY:sy+55,pointerId:77,pointerType:'mouse',button:0}));
                const p=document.getElementById('nodeWindow').getBoundingClientRect();
                return {left:p.left,top:p.top,width:p.width,height:p.height,state:nodeWindowState};
              """)
              assert moved["state"]["nodeNum"]==1,moved
              assert abs(moved["left"]-before["left"])>30 or abs(moved["top"]-before["top"])>30,(before,moved)
              resized=d.execute_script("""
                const h=document.getElementById('nodeWindowResizeHandle');
                const r=h.getBoundingClientRect();
                const sx=r.left+8,sy=r.top+8;
                h.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:sx,clientY:sy,pointerId:78,pointerType:'mouse',button:0}));
                h.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:sx-90,clientY:sy-70,pointerId:78,pointerType:'mouse',button:0}));
                h.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,clientX:sx-90,clientY:sy-70,pointerId:78,pointerType:'mouse',button:0}));
                const p=document.getElementById('nodeWindow').getBoundingClientRect();
                return {left:p.left,top:p.top,width:p.width,height:p.height};
              """)
              assert resized["width"] < moved["width"]-30 or resized["height"] < moved["height"]-30,(moved,resized)
              d.execute_script("render()")
              time.sleep(.35)
              persisted=d.execute_script("const p=document.getElementById('nodeWindow').getBoundingClientRect();return {left:p.left,top:p.top,width:p.width,height:p.height};")
              assert abs(persisted["left"]-resized["left"])<8,(resized,persisted)
              assert abs(persisted["top"]-resized["top"])<8,(resized,persisted)
              assert abs(persisted["width"]-resized["width"])<8,(resized,persisted)
              assert abs(persisted["height"]-resized["height"])<8,(resized,persisted)
              d.execute_script("toggleNodeWindowExpanded()")
              assert "maximized" in d.find_element(By.ID,"nodeWindow").get_attribute("class")
              d.execute_script("toggleNodeWindowExpanded();closeNodeWindow()")
              assert "open" not in d.find_element(By.ID,"nodeWindow").get_attribute("class")
              assert not d.find_elements(By.CSS_SELECTOR,'.navbtn[data-view="tracklog"]')
              assert not d.find_elements(By.ID,"viewTracklog")

              # Sem login: visitante pode personalizar localmente, mas escrita no servidor/malha continua bloqueada.
              time.sleep(.3)
              assert d.execute_script("return authState.enabled===true && authState.authenticated===false")
              assert d.find_element(By.ID,"messageInput").get_attribute("disabled") is not None
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.navbtn[data-view="settings"]'))
              time.sleep(.1)
              assert d.find_element(By.ID,"uiTheme").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mapType").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mapToolbarType").get_attribute("disabled") is None
              assert d.find_element(By.ID,"weatherRadarEnabled").is_selected()
              d.execute_script("arguments[0].value='satellite';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",d.find_element(By.ID,"mapToolbarType"))
              time.sleep(.1)
              assert d.find_element(By.ID,"mapType").get_attribute("value")=="satellite"
              assert d.execute_script("return JSON.parse(localStorage.getItem(PREF_KEY)).mapType")=="satellite"
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"weatherRadarEnabled"))
              time.sleep(.1)
              assert not d.find_element(By.ID,"weatherRadarEnabled").is_selected()
              assert d.execute_script("return JSON.parse(localStorage.getItem(PREF_KEY)).weatherRadarEnabled") is False
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"weatherRadarEnabled"))
              # v1.42.0: controle vertical dinâmico, padrão 3000 m, só com Elevação mínima ligada.
              d.execute_script("setView('map')")
              time.sleep(.1)
              d.execute_script("initElevationControl()")
              elev=d.find_element(By.ID,"elevationThresholdControl")
              assert "active" not in elev.get_attribute("class"),elev.get_attribute("class")
              assert d.find_element(By.ID,"elevationThresholdSlider").get_attribute("min")=="0"
              assert d.find_element(By.ID,"elevationThresholdSlider").get_attribute("max")=="3000"
              assert d.find_element(By.ID,"elevationThresholdNumber").get_attribute("min")=="100"
              assert d.find_element(By.ID,"elevationThresholdNumber").get_attribute("max")=="9000"
              assert d.find_element(By.ID,"elevationThresholdNumber").get_attribute("value")=="3000"
              assert d.find_element(By.ID,"elevationSliderMax").get_attribute("value")=="3000"
              d.execute_script("setElevationThreshold(2800,{persist:false});setElevationSliderMax(2000,{persist:false})")
              assert d.find_element(By.ID,"elevationThresholdSlider").get_attribute("max")=="2000"
              assert d.find_element(By.ID,"elevationThresholdNumber").get_attribute("value")=="2000"
              assert d.execute_script("return elevationThresholdMeters")==2000
              max_label=d.execute_script("return document.getElementById('elevationScaleMax').textContent").replace(".","").replace(",","")
              assert "2000" in max_label,max_label
              d.execute_script("setElevationSliderMax(3000,{persist:false})")
              d.execute_script("const n=document.getElementById('elevationThresholdNumber');n.value='3500';n.dispatchEvent(new Event('change',{bubbles:true}))")
