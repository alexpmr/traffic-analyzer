              assert d.find_element(By.ID,"rfLineColor").get_attribute("disabled") is None
              assert d.find_element(By.ID,"rfLineWidth").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mqttLineColor").get_attribute("disabled") is None
              assert d.find_element(By.ID,"mqttLineWidth").get_attribute("disabled") is None
              assert d.find_element(By.ID,"autoUpdateEnabled").get_attribute("disabled") is not None
              assert d.find_element(By.ID,"saveVisitorDefaults").get_attribute("disabled") is not None
              d.execute_script("arguments[0].value='light';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",d.find_element(By.ID,"uiTheme"))
              assert d.execute_script("return document.body.dataset.theme==='light'")
              assert d.execute_script("return JSON.parse(localStorage.getItem(PREF_KEY)).uiTheme==='light'")
              # A-B somente MQTT/não-RF deve ser tracejado; B-VHF3 RF deve ser contínuo.
              styles=d.execute_script("""
                topology={
                  generatedAtMs:Date.now(),
                  nodes:[
                    {nodeNum:10,nodeId:'!0000000a',name:'A',shortName:'A',latitude:-15.80,longitude:-47.90,state:'identified'},
                    {nodeNum:20,nodeId:'!00000014',name:'B',shortName:'B',latitude:-15.81,longitude:-47.89,state:'identified'},
                    {nodeNum:30,nodeId:'!0000001e',name:'VHF3',shortName:'VHF3',latitude:-15.82,longitude:-47.88,state:'identified'}
                  ],
                  edges:[
                    {a:10,b:20,aId:'!0000000a',bId:'!00000014',aName:'A',bName:'B',geometry:[[-15.80,-47.90],[-15.81,-47.89]],events:[{timestampMs:Date.now(),leg:'forward',snr:null,traceId:1,transport:'mqtt'}]},
                    {a:20,b:30,aId:'!00000014',bId:'!0000001e',aName:'B',bName:'VHF3',geometry:[[-15.81,-47.89],[-15.82,-47.88]],events:[{timestampMs:Date.now(),leg:'forward',snr:5,traceId:1,transport:'rf'}]}
                  ],
                  traces:[]
                };
                document.getElementById('ageHours').value='all';
                document.getElementById('showLines').checked=true;
                render();
                return lineLayer.getLayers().map(x=>({dash:x.options.dashArray||'',color:x.options.color,weight:x.options.weight}));
              """)
              assert len(styles)==2,styles
              assert styles[0]["dash"]=="10 8",styles
              assert styles[1]["dash"] in ("",None),styles
              legend_text=d.find_element(By.CSS_SELECTOR,".legend").get_attribute("textContent")
              assert "Tipo de enlace" in legend_text,legend_text
              assert "MQTT / não-RF" in legend_text,legend_text
              unauth_status=d.execute_async_script("""
                const done=arguments[0];
                fetch('/api/topology/refresh',{method:'POST'}).then(r=>done(r.status)).catch(()=>done(0));
              """)
              assert unauth_status==401,unauth_status
              unauth_defaults=d.execute_async_script("""
                const done=arguments[0];
                fetch('/api/ui-defaults',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefs:{uiTheme:'light'}})}).then(r=>done(r.status)).catch(()=>done(0));
              """)
              assert unauth_defaults==401,unauth_defaults
              unauth_access=d.execute_async_script("""
                const done=arguments[0];fetch('/api/access-stats?days=30',{cache:'no-store'}).then(r=>done(r.status)).catch(()=>done(0));
              """)
              assert unauth_access==401,unauth_access

              # Login administrativo libera apenas ações administrativas e escrita de Mensagens.
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"authAction"))
              d.find_element(By.ID,"authUsername").clear()
              d.find_element(By.ID,"authUsername").send_keys("admin")
              d.find_element(By.ID,"authPassword").send_keys("SenhaTeste123!")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"authLoginSubmit"))
              for _ in range(30):
                  if d.execute_script("return authState.authenticated===true"): break
                  time.sleep(.1)
              assert d.execute_script("return authState.authenticated===true")
              access_stats=d.execute_async_script("""
                const done=arguments[0];fetch('/api/access-stats?days=30',{cache:'no-store'}).then(r=>r.json()).then(done).catch(e=>done({success:false,error:String(e)}));
              """)
              assert access_stats.get("success"),access_stats
              assert str(access_stats.get("logFile","")).endswith("access.log"),access_stats
              assert access_stats.get("summary",{}).get("today",0)>=1,access_stats
              assert d.find_element(By.ID,"uiTheme").get_attribute("disabled") is None
              assert d.find_element(By.ID,"autoUpdateEnabled").get_attribute("disabled") is None
              assert d.find_element(By.ID,"saveVisitorDefaults").get_attribute("disabled") is None
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"saveVisitorDefaults"))
              time.sleep(.4)
              saved=d.execute_async_script("""
                const done=arguments[0];fetch('/api/ui-defaults',{cache:'no-store'}).then(r=>r.json()).then(done).catch(e=>done({success:false,error:String(e)}));
              """)
              assert saved.get("success") and saved.get("defaults",{}).get("uiTheme")=="light",saved
              assert saved.get("defaults",{}).get("rfLineColor")=="#ffff00",saved
              assert saved.get("defaults",{}).get("mqttLineColor")=="#ff8c42",saved
              assert saved.get("defaults",{}).get("rfLineWidth")==3 and saved.get("defaults",{}).get("mqttLineWidth")==3,saved
              assert saved.get("defaults",{}).get("weatherRadarEnabled") is True,saved
              assert saved.get("defaults",{}).get("mapType")=="satellite",saved
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'.navbtn[data-view="messages"]'))
              time.sleep(.1)
              assert d.find_element(By.ID,"messageInput").get_attribute("disabled") is None

              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionBadge"))
              time.sleep(.2)
              assert "open" in d.find_element(By.ID,"versionModalBackdrop").get_attribute("class")
              assert d.find_element(By.ID,"versionContinue").text=="Continuar"
              assert not d.find_elements(By.CSS_SELECTOR,"#versionModalBackdrop .updateCmd")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionContinue"))
              assert "open" not in d.find_element(By.ID,"versionModalBackdrop").get_attribute("class")

              sound_theme=d.find_element(By.ID,"soundTheme")
              sound_values=[o.get_attribute("value") for o in sound_theme.find_elements(By.TAG_NAME,"option")]
              assert sound_values==["pinball70","formal","radio","silent"],sound_values
              d.execute_script("arguments[0].value='pinball70';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",sound_theme)
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"soundTest"))
              time.sleep(1.2)

              # Mensagens: reply estruturado, emoji no compositor e reação agrupada.
              d.execute_script("""
                primaryMessages=[
                  {id:'default_2_101',fromNodeId:'!00000002',fromName:'NODE2',text:'Mensagem original',channel:0,createdAt:Date.now()-3000,mine:false},
                  {id:'default_1_102',fromNodeId:'!00000001',fromName:'TESTE',text:'Resposta',channel:0,createdAt:Date.now()-2000,mine:true,replyId:101},
                  {id:'default_3_103',fromNodeId:'!00000003',fromName:'NODE3',text:'❤️',channel:0,createdAt:Date.now()-1000,mine:false,replyId:101,emoji:1}
                ];
                messagesInitialized=true;renderMessages(false);
              """)
              assert len(d.find_elements(By.CSS_SELECTOR,".msgRow"))==2
              reaction_text=d.find_element(By.CSS_SELECTOR,".reactionChip").get_attribute("textContent")
              assert "❤" in reaction_text,reaction_text
              quote_text=d.find_element(By.CSS_SELECTOR,".msgReplyQuote").get_attribute("textContent")
              assert "Mensagem original" in quote_text,quote_text
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'[data-replymsg="default_2_101"]'))
              assert "open" in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"replyComposerClose"))
              assert "open" not in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageEmojiBtn"))
              assert "open" in d.find_element(By.ID,"emojiPicker").get_attribute("class")
              emoji_button=d.find_element(By.CSS_SELECTOR,"#emojiPicker [data-compose-emoji]")
              emoji_text=emoji_button.get_attribute("data-compose-emoji")
              emoji_px=float(d.execute_script("return parseFloat(getComputedStyle(document.querySelector('#emojiPicker button')).fontSize)"))
              reaction_px=float(d.execute_script("return parseFloat(getComputedStyle(document.querySelector('.reactionChip')).fontSize)"))
              assert emoji_px>=26,(emoji_px,reaction_px)
              assert reaction_px>=18,(emoji_px,reaction_px)
              d.execute_script("arguments[0].click()",emoji_button)
              assert emoji_text in d.find_element(By.ID,"messageInput").get_attribute("value")

              # Rolagem: refresh não pode forçar o fim se o usuário estiver lendo mensagens antigas.
              d.execute_script("""
                const rows=[];
                const base=Date.now()-120000;
                for(let i=0;i<80;i++)rows.push({id:'scroll_2_'+(1000+i),fromNodeId:'!00000002',fromName:'NODE2',text:'Mensagem longa '+i+' '+('x'.repeat(120)),channel:0,createdAt:base+i*1000,mine:false});
                primaryMessages=rows;messagesInitialized=true;messageAutoScroll=true;messagePendingBelow=0;
                renderMessages({forceBottom:true});
                const el=document.getElementById('messageList');
                el.style.scrollBehavior='auto';el.scrollTop=Math.max(0,el.scrollHeight-el.clientHeight-700);
                messageAutoScroll=false;
              """)
              time.sleep(.15)
              old_top=d.execute_script("return document.getElementById('messageList').scrollTop")
              d.execute_script("""
                primaryMessages=[...primaryMessages,{id:'scroll_2_2000',fromNodeId:'!00000002',fromName:'NODE2',text:'NOVA NO FIM '+('y'.repeat(120)),channel:0,createdAt:Date.now(),mine:false}];
                messagePendingBelow=1;renderMessages({forceBottom:false});
              """)
              time.sleep(.15)
              new_top=d.execute_script("return document.getElementById('messageList').scrollTop")
              assert abs(new_top-old_top)<8,(old_top,new_top)
              assert "open" in d.find_element(By.ID,"messageNewBelow").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageNewBelow"))
              time.sleep(.3)
              assert d.execute_script("return messageAutoScroll===true && messagePendingBelow===0")
              assert "open" not in d.find_element(By.ID,"messageNewBelow").get_attribute("class")

              # Histórico: vários traceroutes podem estar em trânsito ao mesmo tempo.
              d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                topology.traces=[
                  {id:'h1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null},
                  {id:'h2',timestampMs:now+20,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null},
                  {id:'h3',timestampMs:now+40,fromName:'A',toName:'B',animatable:true,forwardPath:[p1,p3,p2],returnPath:null}
                ];
                document.getElementById('playMode').value='history';
                stopAnimation();
                playHistoryLoop();
              """)
              time.sleep(.35)
              active_history=d.execute_script("return activeHistoryAnimations.size")
              assert active_history>=2,active_history
              d.execute_script("stopAnimation();document.getElementById('playMode').value='live';startLivePolling();")

              # Ao vivo: runLiveTrace inicia animações independentes, sem serialização.
              active_live=d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                playbackRunning=true;liveAnimationPaused=false;document.getElementById('playMode').value='live';
                runLiveTrace({id:'l1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null});
                runLiveTrace({id:'l2',timestampMs:now,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null});
                return activeLiveAnimations.size;
              """)
              assert active_live>=2,active_live
              d.execute_script("stopAnimation();stopLivePolling();")

              for view in ["nodes","traffic","messages","statistics","settings","help","map"]:
                  b=d.find_element(By.CSS_SELECTOR, f'.navbtn[data-view="{view}"]')
                  d.execute_script("arguments[0].click()", b)
                  time.sleep(.15)
                  active=d.find_element(By.CSS_SELECTOR, ".view.active").get_attribute("id")
                  expected={"nodes":"viewNodes","traffic":"viewTraffic","messages":"viewMessages","statistics":"viewStatistics","settings":"viewSettings","help":"viewHelp","map":"viewMap"}[view]
                  assert active==expected,(view,active,expected)

              stats=d.find_element(By.CSS_SELECTOR, '.navbtn[data-view="statistics"]')
              d.execute_script("arguments[0].click()", stats)
              time.sleep(.15)
              for tab in ["overview","network","rf","routing","traffic","queries","chat","energy","anomalies","access"]:
                  b=d.find_element(By.CSS_SELECTOR, f'.statsTab[data-stats-tab="{tab}"]')
                  d.execute_script("arguments[0].click()", b)
                  time.sleep(.08)
                  panel_id="statsPanel"+tab[:1].upper()+tab[1:]
                  panel=d.find_element(By.ID,panel_id)
                  assert "active" in panel.get_attribute("class"),(tab,panel.get_attribute("class"))
              logs=d.get_log("browser")
              print("BROWSER LOGS AFTER NAVIGATION")
              print(json.dumps(logs,ensure_ascii=False,indent=2))
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
          finally:
              d.quit()
          PY
          kill "$(cat /tmp/ta-web.pid)" || true
