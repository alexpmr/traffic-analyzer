name: Validar Traffic Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar Python
        run: python -m py_compile traffic_analyzer.py traffic_analyzer_web.py auto_update.py docs/build_manual_pdf.py

      - name: Validar shell
        run: bash -n install.sh update.sh

      - name: Validar replies e reações no backend
        run: |
          python - <<'PY'
          import traffic_analyzer_web as ta
          calls=[]
          ta.MM_API_TOKEN="test-token"
          def fake(path, payload):
              calls.append((path,payload))
              return {"success":True}
          ta._mm_api_post=fake

          ta._send_primary_message("resposta", reply_id=123, emoji=False)
          path,payload=calls.pop(0)
          assert path.endswith("/messages"), path
          assert payload["text"]=="resposta"
          assert payload["channel"]==0
          assert payload["replyId"]==123

          ta._send_primary_message("❤️", reply_id=123, emoji=True)
          path,payload=calls.pop(0)
          assert path=="/api/messages/send", path
          assert payload["text"]=="❤️"
          assert payload["replyId"]==123
          assert payload["emoji"]==1
          assert payload["sourceId"]==ta.MM_SOURCE
          PY

      - name: Validar JavaScript embutido
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("traffic_analyzer_web.py").read_text(encoding="utf-8")
          marker = "<script>\n"
          start = src.index(marker) + len(marker)
          end = src.index("</script>\n</body>", start)
          Path("/tmp/traffic-analyzer.js").write_text(src[start:end], encoding="utf-8")
          PY
          node --check /tmp/traffic-analyzer.js

      - name: Validar geração do manual
        run: |
          python -m pip install --disable-pip-version-check --quiet reportlab pymupdf
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          python docs/build_manual_pdf.py --version "$VERSION" --output /tmp/manual.pdf
          test -s /tmp/manual.pdf
          python - <<'PY'
          import fitz
          doc = fitz.open("/tmp/manual.pdf")
          assert len(doc) >= 1
          pix = doc[0].get_pixmap(matrix=fitz.Matrix(1.5, 1.5), alpha=False)
          pix.save("/tmp/manual-preview.png")
          PY
          test -s /tmp/manual-preview.png

      - name: Publicar prévia do manual
        uses: actions/upload-artifact@v4
        with:
          name: manual-preview
          path: |
            /tmp/manual.pdf
            /tmp/manual-preview.png

      - name: Validar arquivos da infraestrutura de update
        run: |
          test -s traffic-analyzer-auto-update.service
          test -s traffic-analyzer-auto-update.path
          grep -q 'PathExists=/var/lib/traffic-analyzer/update-request.json' traffic-analyzer-auto-update.path
          grep -q 'ExecStart=/usr/bin/python3 /opt/traffic-analyzer/auto_update.py' traffic-analyzer-auto-update.service

      - name: Smoke test da interface no navegador
        run: |
          python -m pip install --disable-pip-version-check --quiet selenium
          cat >/tmp/topology.json <<'JSON'
          {"generatedAtMs":0,"summary":{"nodesInApi":1,"traceroutesRead":0,"traceroutesInWindow":0,"routeParticipants":0,"identified":1,"stub":0,"routeOnly":0,"mappableNodes":1,"observedEdges":0,"mappableEdges":0},"nodes":[{"nodeNum":1,"nodeId":"!00000001","name":"TESTE","shortName":"TST","latitude":-15.8,"longitude":-47.9,"state":"identified"}],"edges":[],"traces":[]}
          JSON
          MAP_BIND=127.0.0.1 MAP_PORT=8788 TOPOLOGY_FILE=/tmp/topology.json TRAFFIC_ARCHIVE_DB=/tmp/traffic.db UPDATE_SETTINGS_FILE=/tmp/update-settings.json UPDATE_REQUEST_FILE=/tmp/update-request.json UPDATE_STATUS_FILE=/tmp/update-status.json LAST_INSTALL_FILE=/tmp/last-install.json python traffic_analyzer_web.py >/tmp/ta-web.log 2>&1 &
          echo $! >/tmp/ta-web.pid
          python - <<'PY'
          import time, urllib.request
          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8788/health", timeout=1) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit(open("/tmp/ta-web.log").read())
          PY
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          import json, time
          opt=Options()
          opt.add_argument("--headless=new")
          opt.add_argument("--no-sandbox")
          opt.add_argument("--disable-dev-shm-usage")
          opt.add_argument("--window-size=1600,1000")
          opt.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d=webdriver.Chrome(options=opt)
          try:
              d.get("http://127.0.0.1:8788/")
              WebDriverWait(d,20).until(EC.presence_of_element_located((By.ID,"nav")))
              time.sleep(2)
              logs=d.get_log("browser")
              print("BROWSER LOGS AFTER LOAD")
              print(json.dumps(logs,ensure_ascii=False,indent=2))
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe

              lang=d.find_element(By.ID,"uiLanguage")
              labels=[o.text for o in lang.find_elements(By.TAG_NAME,"option")]
              assert labels==["🇧🇷 Português","🇺🇸 English"],labels

              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionBadge"))
              time.sleep(.2)
              assert "open" in d.find_element(By.ID,"versionModalBackdrop").get_attribute("class")
              assert d.find_element(By.ID,"versionContinue").text=="Continuar"
              assert not d.find_elements(By.CSS_SELECTOR,"#versionModalBackdrop .updateCmd")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"versionContinue"))
              assert "open" not in d.find_element(By.ID,"versionModalBackdrop").get_attribute("class")

              sound_theme=d.find_element(By.ID,"soundTheme")
              sound_values=[o.get_attribute("value") for o in sound_theme.find_elements(By.TAG_NAME,"option")]
              assert sound_values==["pinball70","formal","radio","silent"],sound_values
              d.execute_script("arguments[0].value='pinball70';arguments[0].dispatchEvent(new Event('change',{bubbles:true}))",sound_theme)
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"soundTest"))
              time.sleep(1.2)

              # Mensagens: reply estruturado, emoji no compositor e reação agrupada.
              d.execute_script("""
                primaryMessages=[
                  {id:'default_2_101',fromNodeId:'!00000002',fromName:'NODE2',text:'Mensagem original',channel:0,createdAt:Date.now()-3000,mine:false},
                  {id:'default_1_102',fromNodeId:'!00000001',fromName:'TESTE',text:'Resposta',channel:0,createdAt:Date.now()-2000,mine:true,replyId:101},
                  {id:'default_3_103',fromNodeId:'!00000003',fromName:'NODE3',text:'❤️',channel:0,createdAt:Date.now()-1000,mine:false,replyId:101,emoji:1}
                ];
                messagesInitialized=true;renderMessages(false);
              """)
              assert len(d.find_elements(By.CSS_SELECTOR,".msgRow"))==2
              reaction_text=d.find_element(By.CSS_SELECTOR,".reactionChip").text
              assert "❤" in reaction_text,reaction_text
              assert "Mensagem original" in d.find_element(By.CSS_SELECTOR,".msgReplyQuote").text
              d.execute_script("arguments[0].click()",d.find_element(By.CSS_SELECTOR,'[data-replymsg="default_2_101"]'))
              assert "open" in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"replyComposerClose"))
              assert "open" not in d.find_element(By.ID,"replyComposerBar").get_attribute("class")
              d.execute_script("arguments[0].click()",d.find_element(By.ID,"messageEmojiBtn"))
              assert "open" in d.find_element(By.ID,"emojiPicker").get_attribute("class")
              emoji_button=d.find_element(By.CSS_SELECTOR,"#emojiPicker [data-compose-emoji]")
              emoji_text=emoji_button.get_attribute("data-compose-emoji")
              d.execute_script("arguments[0].click()",emoji_button)
              assert emoji_text in d.find_element(By.ID,"messageInput").get_attribute("value")

              # Histórico: vários traceroutes podem estar em trânsito ao mesmo tempo.
              d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                topology.traces=[
                  {id:'h1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null},
                  {id:'h2',timestampMs:now+20,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null},
                  {id:'h3',timestampMs:now+40,fromName:'A',toName:'B',animatable:true,forwardPath:[p1,p3,p2],returnPath:null}
                ];
                document.getElementById('playMode').value='history';
                stopAnimation();
                playHistoryLoop();
              """)
              time.sleep(.35)
              active_history=d.execute_script("return activeHistoryAnimations.size")
              assert active_history>=2,active_history
              d.execute_script("stopAnimation();document.getElementById('playMode').value='live';startLivePolling();")

              # Ao vivo: runLiveTrace inicia animações independentes, sem serialização.
              active_live=d.execute_script("""
                const now=Date.now();
                const p1={nodeNum:1,nodeId:'!00000001',name:'A',lat:-15.80,lon:-47.90};
                const p2={nodeNum:2,nodeId:'!00000002',name:'B',lat:-15.70,lon:-47.80};
                const p3={nodeNum:3,nodeId:'!00000003',name:'C',lat:-15.60,lon:-47.70};
                playbackRunning=true;liveAnimationPaused=false;document.getElementById('playMode').value='live';
                runLiveTrace({id:'l1',timestampMs:now,fromName:'A',toName:'C',animatable:true,forwardPath:[p1,p2,p3],returnPath:null});
                runLiveTrace({id:'l2',timestampMs:now,fromName:'C',toName:'A',animatable:true,forwardPath:[p3,p2,p1],returnPath:null});
                return activeLiveAnimations.size;
              """)
              assert active_live>=2,active_live
              d.execute_script("stopAnimation();stopLivePolling();")

              for view in ["traffic","messages","health","anomalies","settings","help","map"]:
                  b=d.find_element(By.CSS_SELECTOR, f'.navbtn[data-view="{view}"]')
                  d.execute_script("arguments[0].click()", b)
                  time.sleep(.15)
                  active=d.find_element(By.CSS_SELECTOR, ".view.active").get_attribute("id")
                  expected={"traffic":"viewTraffic","messages":"viewMessages","health":"viewHealth","anomalies":"viewAnomalies","settings":"viewSettings","help":"viewHelp","map":"viewMap"}[view]
                  assert active==expected,(view,active,expected)
              logs=d.get_log("browser")
              print("BROWSER LOGS AFTER NAVIGATION")
              print(json.dumps(logs,ensure_ascii=False,indent=2))
              severe=[x for x in logs if x.get("level")=="SEVERE" and "Failed to load resource" not in x.get("message","")]
              assert not severe,severe
          finally:
              d.quit()
          PY
          kill "$(cat /tmp/ta-web.pid)" || true
